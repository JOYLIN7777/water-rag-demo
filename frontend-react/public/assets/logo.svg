<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="水利知识库">
  <defs>
    <linearGradient id="wkBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6d9aff"/>
      <stop offset="0.55" stop-color="#3b6ef5"/>
      <stop offset="1" stop-color="#2450c8"/>
    </linearGradient>
    <linearGradient id="wkDrop" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e6f0ff"/>
    </linearGradient>
  </defs>
  <rect width="48" height="48" rx="13" fill="url(#wkBg)"/>
  <!-- 水滴：水利/水资源的第一识别符号 -->
  <path d="M24 8.6c5 6.2 8.8 11.2 8.8 15.8a8.8 8.8 0 0 1-17.6 0c0-4.6 3.8-9.6 8.8-15.8z" fill="url(#wkDrop)"/>
  <!-- 水滴内部的水位线 -->
  <path d="M17.9 25.9c1.6 1.4 3.3 1.4 4.9 0s3.3-1.4 4.9 0 3.3 1.4 4.9 0"
        stroke="#3b6ef5" stroke-width="1.9" fill="none" stroke-linecap="round" opacity="0.72"/>
  <!-- 底部波浪：河道 -->
  <path d="M9.5 38.4c2.9-2.3 5.8-2.3 8.7 0s5.8 2.3 8.7 0 5.8-2.3 8.7 0"
        stroke="#ffffff" stroke-width="2.3" fill="none" stroke-linecap="round" opacity="0.62"/>
</svg>
