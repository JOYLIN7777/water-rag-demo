# 完整环境编排：pgvector 数据库 + 应用；Redis 默认用宿主机已启动的实例
#
# 启动步骤：
#   1. 确认本机 Redis 在 6379 运行（当前环境就是）
#   2. 设置 API Key：CMD: set AI_API_KEY=sk-xxx / PowerShell: $env:AI_API_KEY="sk-xxx"
#   3. mvn -DskipTests package  （构建 jar）
#   4. docker compose up -d --build app
#
# 若想把 Redis 也放进 Docker：docker compose --profile docker-redis up -d --build app
# 并把应用环境变量 REDIS_HOST 改为 redis（见下方 app.environment 注释）
services:
  # ============ Elasticsearch 8：混合检索底座（全文 BM25 + 向量 kNN + RRF 融合）============
  elasticsearch:
    image: docker.m.daocloud.io/library/elasticsearch:8.13.4
    container_name: waterkb-es
    environment:
      discovery.type: single-node
      xpack.security.enabled: false       # 作品集环境关闭安全；生产必须开启并配 TLS
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"   # 限制堆内存，避免吃满本机内存
      bootstrap.memory_lock: "false"
    ports:
      - "9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q 'status'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  postgres:
    image: pgvector/pgvector:pg16
    container_name: waterkb-pg
    environment:
      POSTGRES_DB: waterkb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: rag123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # 容器首次初始化时自动启用 vector 扩展
      - ./init/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d waterkb"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 可选 Redis（默认不启动，用宿主机的）；需要时加 --profile docker-redis
  redis:
    image: redis:7-alpine
    container_name: waterkb-redis
    profiles: ["docker-redis"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  app:
    build: .
    container_name: waterkb-app
    # 只强制等数据库健康；ES 用软依赖（EsIndexService 初始化失败会自动降级为空检索，
    # 不会让应用起不来），这样 ES 镜像拉取慢/未启动时应用仍可用
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_started
    ports:
      # 宿主机 18080 → 容器 8080；本地浏览器访问 localhost:18080 即容器内的应用
      - "18080:8080"
    environment:
      # 容器内用服务名 postgres 访问数据库（Docker DNS 解析）
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: waterkb
      DB_USER: postgres
      DB_PASSWORD: rag123
      # host.docker.internal = 宿主机；若启用 docker-redis profile 则改成 redis
      REDIS_HOST: ${REDIS_HOST:-host.docker.internal}
      REDIS_PORT: 6379
      # Key 从启动 compose 的 shell 环境变量读取，不写进文件、不进 Git
      AI_API_KEY: ${AI_API_KEY}
      AI_BASE_URL: ${AI_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode}
      AI_CHAT_MODEL: ${AI_CHAT_MODEL:-qwen-plus}
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-text-embedding-v3}
      # 引用片段上限（默认 20，可按机器/模型性能调整）
      RAG_TOP_K: ${RAG_TOP_K:-20}
      # 百炼业务空间 ID：配置后用量统计优先走官方接口，未配置/接口异常自动回退本地调用记录
      BAILIAN_WORKSPACE_ID: ${BAILIAN_WORKSPACE_ID:-}
      # 容器内用服务名 elasticsearch 访问 ES
      ES_URL: ${ES_URL:-http://elasticsearch:9200}
      # JWT 签名密钥从环境变量传入，绝不写入文件/镜像；未设置时应用用内置 Demo 密钥
      JWT_SECRET: ${JWT_SECRET:-water-rag-demo-dev-secret-change-in-prod}
    extra_hosts:
      # Linux 需要显式映射；Docker Desktop for Windows/Mac 已内置该主机名
      - "host.docker.internal:host-gateway"
    dns:
      # 固定公共 DNS，绕开宿主机间歇性 DNS 故障（2026-11-20 实测默认 DNS 时好时坏）
      - 114.114.114.114
      - 223.5.5.5

volumes:
  pgdata:
  redisdata:
  esdata:
