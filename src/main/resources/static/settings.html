<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>设置 · 水利知识库</title>
<link rel="icon" type="image/svg+xml" href="assets/logo.svg">
<link rel="stylesheet" href="assets/app.css">
<style>
  .setting-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
  .setting-card{display:flex;align-items:flex-start;gap:14px;background:#fff;border:1px solid var(--line);border-radius:var(--radius);
    padding:20px;text-decoration:none;box-shadow:var(--shadow-sm);transition:all .18s}
  .setting-card:hover{border-color:#b9cbff;box-shadow:0 8px 22px rgba(59,110,245,.13);transform:translateY(-2px)}
  .setting-card.locked{opacity:.55;cursor:not-allowed}
  .setting-card.locked:hover{transform:none;border-color:var(--line);box-shadow:var(--shadow-sm)}
  .setting-icon{width:44px;height:44px;border-radius:12px;flex:0 0 44px;background:var(--primary-soft);color:var(--primary);
    display:flex;align-items:center;justify-content:center}
  .setting-icon svg{width:22px;height:22px}
  .setting-text{min-width:0;flex:1}
  .setting-name{font-size:15px;font-weight:650;color:var(--ink);display:flex;align-items:center;gap:9px}
  .setting-desc{font-size:12.5px;color:var(--ink-2);line-height:1.7;margin-top:7px}
  .setting-go{font-size:11.5px;color:var(--primary);margin-top:12px;display:inline-flex;align-items:center;gap:4px}
  .setting-card.locked .setting-go{color:var(--muted)}
</style>
</head>
<body>
<div class="layout" id="sidebarHost">
<main class="main">
  <header class="topbar">
    <div class="topbar-left"><div class="topbar-title">设置</div><span class="topbar-sub">更多功能</span></div>
    <span id="adminEntrySlot" class="admin-slot"></span>
  </header>

  <div class="page">
    <div class="page-head">
      <h1 class="page-title">设置</h1>
      <p class="page-desc">更多功能都放在这里，按需使用即可。只显示当前账号有权使用的功能。</p>
    </div>

    <div class="setting-grid" id="settingGrid">加载中…</div>
  </div>
</main>
</div>

<script src="assets/auth.js"></script>
<script src="assets/ui.js"></script>
<script src="assets/app.js"></script>
<script>
const E=window.UI.el;
function htmlNodes(html){
  const body=new DOMParser().parseFromString('<body>'+String(html||'')+'</body>','text/html').documentElement.querySelector('body');
  return body?Array.from(body.childNodes):[];
}

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const ICONS={
  search:'<circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>',
  model:'<rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/>',
  tree:'<rect x="9" y="2" width="6" height="4" rx="1"/><rect x="2" y="16" width="6" height="4" rx="1"/><rect x="16" y="16" width="6" height="4" rx="1"/><path d="M12 6v4M5 16v-3a3 3 0 0 1 3-3h8a3 3 0 0 1 3 3v3"/>',
  shield:'<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><polyline points="9 12 11 14 15 10"/>'
};
function icon(name){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+(ICONS[name]||'')+'</svg>'}

async function renderSettings(){
  const defs=window.ShellSettings||[];
  // 等权限清单回来再判定：否则拿空集合会把有权限的入口也藏掉
  if(window.Shell&&Shell.permsReady)await Shell.permsReady();
  const visible=defs.filter(s=>{
    // 按权限码过滤（菜单权限页勾了才显示）；没配 perm 的入口所有人可见
    if(s.perm&&window.Shell&&Shell.hasPermission)return Shell.hasPermission(s.perm);
    return true;
  });
  document.getElementById('settingGrid').replaceChildren(...(visible.length?visible.map(s=>{
    const card=E('a',{className:'setting-card',attrs:{href:s.href}});
    const ic=E('span',{className:'setting-icon'});ic.append(...htmlNodes(icon(s.icon)));
    card.append(ic,E('span',{className:'setting-text'},[
      E('span',{className:'setting-name',text:s.label}),E('span',{className:'setting-desc',text:s.desc}),
      E('span',{className:'setting-go',text:'进入功能'})]));
    return card;
  }):[E('div',{className:'card'},E('div',{className:'empty-inline',text:'当前账号暂无可使用的设置项'}))]));
}

initShell('settings');
renderSettings();
</script>
</body>
</html>
