<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>水利知识库智能问答系统</title>
<style>
  :root{
    --navy:#111c33;--navy-2:#18253f;--navy-3:#22304d;
    --primary:#3b6ef5;--primary-hi:#5b8bff;--primary-soft:#eaf1ff;
    --ink:#1b2436;--ink-2:#475569;--muted:#8a95a8;--line:#e7ebf2;
    --bg:#f5f7fb;--white:#fff;--ok:#0e9f6e;--danger:#e0245e;
    --shadow-sm:0 1px 3px rgba(16,28,54,.06);
    --shadow-md:0 8px 24px rgba(16,28,54,.08);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);background:var(--bg);font-size:14px;-webkit-font-smoothing:antialiased}
  button,input,textarea{font-family:inherit}
  button{cursor:pointer}
  button:disabled{cursor:not-allowed;opacity:.55}

  /* ============ 布局 ============ */
  .layout{display:flex;height:100vh;overflow:hidden}

  /* ============ 侧栏（深靛蓝，企业级产品质感） ============ */
  .sidebar{width:286px;flex:0 0 286px;background:linear-gradient(180deg,var(--navy) 0%,var(--navy-2) 100%);color:#c8d3e8;display:flex;flex-direction:column;padding:22px 16px 14px;position:relative;z-index:2}
  .brand{display:flex;align-items:center;gap:11px;padding:0 6px 22px}
  .brand-mark{width:40px;height:40px;border-radius:11px;background:linear-gradient(135deg,var(--primary-hi),var(--primary));color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;box-shadow:0 4px 14px rgba(59,110,245,.45)}
  .brand-title{font-size:15px;font-weight:650;color:#f2f6ff;letter-spacing:.3px}
  .brand-sub{font-size:11px;color:#7f90b3;margin-top:3px;letter-spacing:.2px}
  .new-chat{width:100%;padding:11px;border:1px solid rgba(139,164,255,.28);border-radius:9px;background:linear-gradient(135deg,rgba(59,110,245,.28),rgba(59,110,245,.16));color:#e8efff;font-size:13.5px;font-weight:600;transition:all .18s;display:flex;align-items:center;justify-content:center;gap:7px}
  .new-chat:hover{background:rgba(59,110,245,.42);border-color:rgba(139,164,255,.5);transform:translateY(-1px)}
  .section-label{font-size:10.5px;color:#6f80a4;letter-spacing:1.2px;margin:22px 6px 9px;font-weight:600;text-transform:uppercase}
  .session-list{flex:1;overflow-y:auto;min-height:60px;margin:0 -4px;padding:0 4px}
  .session-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;color:#c8d3e8;cursor:pointer;transition:all .15s;margin-bottom:3px;position:relative}
  .session-item:hover{background:rgba(255,255,255,.06)}
  .session-item.active{background:rgba(59,110,245,.22);color:#fff}
  .session-item.active::before{content:'';position:absolute;left:-4px;top:11px;bottom:11px;width:3px;border-radius:2px;background:var(--primary-hi)}
  .session-dot{width:7px;height:7px;border-radius:50%;background:#46597c;flex:0 0 7px}
  .session-item.active .session-dot{background:#7fa4ff;box-shadow:0 0 0 3px rgba(127,164,255,.18)}
  .session-body{flex:1;min-width:0}
  .session-name{display:block;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
  .session-time{display:block;font-size:10.5px;color:#6f80a4;margin-top:2px}
  .session-item.active .session-time{color:#93a7d0}
  .session-delete{border:0;background:transparent;color:#6f80a4;font-size:17px;opacity:0;padding:0 3px;line-height:1;transition:all .15s;border-radius:4px}
  .session-item:hover .session-delete{opacity:1}
  .session-delete:hover{color:#ff8fab;background:rgba(255,255,255,.08)}

  .upload-area{border-top:1px solid rgba(255,255,255,.09);padding-top:4px;margin-top:10px}
  .upload-area .section-label{margin-top:14px}
  .dropzone{border:1.5px dashed rgba(139,164,255,.32);border-radius:10px;padding:15px 10px;text-align:center;cursor:pointer;transition:all .2s;background:rgba(255,255,255,.025)}
  .dropzone:hover,.dropzone.dragging{border-color:var(--primary-hi);background:rgba(59,110,245,.18)}
  .drop-icon{font-size:21px;color:#8fb0ff;line-height:1}
  .drop-text{font-size:12.5px;color:#cbd6ec;margin-top:7px}
  .drop-formats{font-size:10px;color:#6f80a4;margin-top:5px;line-height:1.5;word-break:break-all}
  .upload-msg{font-size:11.5px;margin-top:8px;padding:7px 9px;border-radius:7px;line-height:1.55;word-break:break-all;background:rgba(255,255,255,.05);color:#cbd6ec}
  .upload-msg.ok{background:rgba(14,159,110,.16);color:#7ce0b5;border:1px solid rgba(14,159,110,.3)}
  .upload-msg.err{background:rgba(224,36,94,.15);color:#ff9fbb;border:1px solid rgba(224,36,94,.28)}
  .doc-list{margin-top:10px;max-height:146px;overflow-y:auto}
  .doc-item{display:flex;align-items:center;gap:7px;padding:6px 8px;border-radius:7px;font-size:11.5px;color:#b9c6de}
  .doc-item:hover{background:rgba(255,255,255,.06)}
  .doc-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .doc-meta{font-size:10px;color:#6f80a4;flex:0 0 auto}
  .doc-delete{border:0;background:transparent;color:#6f80a4;font-size:14px;opacity:0;padding:0 2px;line-height:1}
  .doc-item:hover .doc-delete{opacity:1}
  .doc-delete:hover{color:#ff8fab}
  .doc-empty{font-size:11px;color:#5c6c8d;text-align:center;padding:8px 0}
  .folder-btn{width:100%;margin-top:8px;padding:8px;border:1px dashed rgba(139,164,255,.3);border-radius:8px;background:transparent;color:#a9b9d8;font-size:11.5px;transition:all .15s}
  .folder-btn:hover{border-color:var(--primary-hi);color:#dbe6ff;background:rgba(59,110,245,.12)}
  .doc-more{display:block;font-size:11px;color:#7fa4ff;text-decoration:none;padding:7px 8px 2px;text-align:left}
  .doc-more:hover{text-decoration:underline}
  .sidebar-footer{font-size:10px;color:#4e5f80;text-align:center;margin-top:14px;letter-spacing:.2px}

  /* ============ 主区 ============ */
  .main{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg)}
  .topbar{height:64px;flex:0 0 64px;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;box-shadow:var(--shadow-sm)}
  .topbar-left{display:flex;align-items:center;gap:11px}
  .topbar-title{font-size:15px;font-weight:650;color:var(--ink)}
  .status-pill{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--ok);background:#e8f8f1;border:1px solid #c6ecd9;padding:4px 10px;border-radius:20px;font-weight:500}
  .status-dot{width:6px;height:6px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(14,159,110,.15)}
  .status-pill.off{color:var(--danger);background:#fdeef3;border-color:#f8cfdc}
  .status-pill.off .status-dot{background:var(--danger);box-shadow:0 0 0 3px rgba(224,36,94,.14)}
  .topbar-nav{display:flex;align-items:center;gap:7px}
  .text-btn{border:1px solid var(--line);background:#fff;color:var(--ink-2);padding:7px 12px;border-radius:8px;font-size:12px;transition:all .15s;text-decoration:none;display:inline-block;line-height:1.3;white-space:nowrap}
  .text-btn:hover{border-color:#b9cbff;color:var(--primary);background:var(--primary-soft)}
  .nav-link{line-height:1.3}

  .scroll-area{flex:1;overflow-y:auto;padding:32px 6% 24px;scroll-behavior:smooth}
  .welcome{max-width:760px;margin:8vh auto 0;text-align:center;animation:fadeUp .4s ease}
  @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .welcome-mark{width:62px;height:62px;border-radius:17px;background:linear-gradient(135deg,var(--primary-hi),var(--primary));color:#fff;font-size:26px;font-weight:700;display:flex;align-items:center;justify-content:center;margin:0 auto 20px;box-shadow:0 10px 28px rgba(59,110,245,.3)}
  .welcome h1{font-size:23px;color:var(--ink);margin:0 0 11px;font-weight:680;letter-spacing:.3px}
  .welcome p{font-size:13.5px;color:var(--ink-2);line-height:1.8;margin:0 auto 30px;max-width:560px}
  .quick-list{display:grid;grid-template-columns:1fr 1fr;gap:11px;max-width:660px;margin:0 auto}
  .quick-item{border:1px solid var(--line);background:#fff;border-radius:11px;padding:14px 16px;font-size:13px;color:var(--ink-2);text-align:left;box-shadow:var(--shadow-sm);transition:all .18s;line-height:1.5}
  .quick-item:hover{border-color:#b9cbff;background:var(--primary-soft);color:var(--primary);transform:translateY(-2px);box-shadow:0 6px 18px rgba(59,110,245,.12)}
  .quick-item::before{content:'✦';color:var(--primary);margin-right:8px;font-size:11px}

  .messages{max-width:900px;margin:0 auto}
  .message-row{display:flex;gap:14px;margin-bottom:26px;align-items:flex-start;animation:fadeUp .25s ease}
  .message-row.is-user{flex-direction:row-reverse}
  .avatar{width:36px;height:36px;border-radius:10px;flex:0 0 36px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;box-shadow:var(--shadow-sm)}
  .avatar-user{background:linear-gradient(135deg,#d8e4ff,#c3d6ff);color:#1e4bb8}
  .avatar-ai{background:linear-gradient(135deg,var(--primary-hi),var(--primary));color:#fff}
  .message-body{max-width:min(840px,84%);min-width:0}
  .message-sender{font-size:11.5px;color:var(--muted);margin:0 0 7px 3px;font-weight:600;letter-spacing:.3px}
  .is-user .message-sender{text-align:right;margin-right:3px}
  .message-bubble{padding:13px 17px;border-radius:13px;font-size:14px;box-shadow:var(--shadow-sm);white-space:pre-wrap;line-height:1.7}
  .bubble-user{background:linear-gradient(135deg,var(--primary),#2f61e8);color:#fff;border-bottom-right-radius:4px;box-shadow:0 3px 12px rgba(59,110,245,.22)}
  .bubble-ai{background:#fff;color:var(--ink);border:1px solid var(--line);border-bottom-left-radius:4px}
  .source-card{border:1px solid #dbe6ff;background:linear-gradient(180deg,#f7faff,#fbfcff);border-radius:10px;margin-bottom:9px;overflow:hidden}
  .source-head{display:flex;align-items:center;gap:8px;width:100%;border:0;background:transparent;padding:10px 13px;color:#25469b;font-size:12.5px;text-align:left;font-weight:500}
  .source-head:hover{background:#eff5ff}
  .source-title{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .source-list{border-top:1px solid #dbe6ff;padding:4px 13px 11px}
  .source-item{padding:8px 0;border-bottom:1px dashed #dde7fb}
  .source-item:last-child{border-bottom:0}
  .source-file{font-size:12px;font-weight:650;color:#1e3a8a}
  .source-index{font-size:10.5px;color:#3568d4;background:#e3ecff;padding:2px 7px;border-radius:10px;margin-left:8px}
  .source-preview{font-size:12px;color:var(--ink-2);line-height:1.65;margin-top:4px}
  .cursor{display:inline-block;width:7px;height:15px;background:var(--primary);vertical-align:text-bottom;margin-left:2px;animation:blink 1s steps(2) infinite}
  @keyframes blink{50%{opacity:0}}

  /* ============ 输入区 ============ */
  .composer-wrap{flex:0 0 auto;padding:12px 6% 18px;background:linear-gradient(transparent,var(--bg) 20%)}
  .error-bar{max-width:900px;margin:0 auto 9px;padding:9px 13px;border-radius:8px;background:#fdeef3;color:#b91c4a;font-size:12.5px;border:1px solid #f8cfdc;box-shadow:var(--shadow-sm)}
  .composer{max-width:900px;margin:0 auto;display:flex;gap:11px;align-items:flex-end;background:#fff;border:1px solid #d9e0ec;border-radius:14px;padding:11px 11px 11px 16px;box-shadow:var(--shadow-md);transition:all .18s}
  .composer:focus-within{border-color:var(--primary);box-shadow:0 0 0 4px rgba(59,110,245,.1),var(--shadow-md)}
  .composer textarea{flex:1;resize:none;border:0;outline:0;font-size:14px;line-height:1.6;max-height:160px;min-height:24px;padding:6px 0;color:var(--ink);background:transparent}
  .send-btn{border:0;background:linear-gradient(135deg,var(--primary-hi),var(--primary));color:#fff;padding:10px 20px;border-radius:9px;font-size:13px;font-weight:600;transition:all .18s;box-shadow:0 3px 10px rgba(59,110,245,.28);display:flex;align-items:center;gap:6px}
  .send-btn:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 5px 16px rgba(59,110,245,.36)}
  .composer-tip{text-align:center;font-size:10.5px;color:var(--muted);margin-top:9px;letter-spacing:.2px}

  /* ============ Markdown 正文 ============ */
  .md-body p{margin:0 0 10px}.md-body p:last-child{margin-bottom:0}
  .md-body h1,.md-body h2,.md-body h3,.md-body h4{color:var(--ink);margin:14px 0 8px;line-height:1.4}
  .md-body h1{font-size:18px}.md-body h2{font-size:16px}.md-body h3{font-size:14.5px}
  .md-body ul,.md-body ol{margin:5px 0 7px;padding-left:22px}
  .md-body li{margin:2px 0}
  .md-body code{background:#eef2f8;padding:1px 5px;border-radius:4px;font-size:.9em;color:#b02a5b}
  .md-body table{border-collapse:collapse;margin:11px 0;font-size:.92em;max-width:100%;display:block;overflow-x:auto}
  .md-body th,.md-body td{border:1px solid #dbe2ee;padding:6px 11px;text-align:left}
  .md-body th{background:#f2f5fa;font-weight:650}
  .md-body hr{border:0;border-top:1px solid var(--line);margin:13px 0}
  .md-body pre{background:#111c33;color:#dbe4f5;padding:13px 15px;border-radius:9px;overflow-x:auto}
  .md-body pre code{background:transparent;padding:0;color:inherit}

  /* Toast 通知 */
  .toast{position:fixed;right:24px;bottom:24px;background:var(--navy);color:#fff;padding:12px 17px;border-radius:10px;font-size:12.5px;box-shadow:0 12px 32px rgba(16,28,54,.28);z-index:99;opacity:0;transform:translateY(12px);transition:all .25s;pointer-events:none;max-width:340px;line-height:1.5}
  .toast.show{opacity:1;transform:none}
  .toast.ok{background:linear-gradient(135deg,#0e9f6e,#0b8a60)}
  .toast.err{background:linear-gradient(135deg,#e0245e,#c41e50)}

  ::-webkit-scrollbar{width:8px;height:8px}
  ::-webkit-scrollbar-thumb{background:#cfd7e5;border-radius:4px}
  ::-webkit-scrollbar-thumb:hover{background:#b6c1d4}
  ::-webkit-scrollbar-track{background:transparent}
  .sidebar ::-webkit-scrollbar-thumb{background:#3b4b6b}

  @media(max-width:980px){
    .sidebar{width:230px;flex-basis:230px}
    .topbar-nav .text-btn{padding:6px 9px;font-size:11px}
    .quick-list{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">水</div>
      <div><div class="brand-title">水利知识库</div><div class="brand-sub">RAG 智能问答系统</div></div>
    </div>
    <button class="new-chat" onclick="newSession()">＋ 新建会话</button>
    <div class="section-label">历史会话</div>
    <div class="session-list" id="sessionList"></div>
    <div class="upload-area">
      <div class="section-label">知识库文档</div>
      <div class="dropzone" id="dropzone">
        <div class="drop-icon">⇪</div>
        <div class="drop-text" id="dropText">点击或拖拽上传文档</div>
        <div class="drop-formats" id="dropFormats">txt / md / pdf / docx / xlsx / pptx 等 36 种格式</div>
      </div>
      <div class="upload-msg" id="uploadMsg" style="display:none"></div>
      <button class="folder-btn" onclick="document.getElementById('folderInput').click()">📁 选择文件夹上传</button>
      <div class="doc-list" id="docList"></div>
      <input type="file" id="fileInput" hidden>
      <input type="file" id="folderInput" webkitdirectory hidden>
    </div>
    <div class="sidebar-footer">Spring Boot 3.4 · Spring AI · Elasticsearch</div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="topbar-left">
        <div class="topbar-title">知识库问答</div>
        <span class="status-pill" id="statusPill"><span class="status-dot"></span>服务正常</span>
      </div>
      <div class="topbar-nav">
        <button class="text-btn" onclick="testTool()" title="直接调用水情工具验证权限">工具演示</button>
        <button class="text-btn" onclick="clearHistory()">清空历史</button>
        <a class="text-btn nav-link" id="treeLink" href="tree.html">会话树</a>
        <a class="text-btn nav-link" href="search.html">检索实验</a>
        <a class="text-btn nav-link" href="models.html">模型配置</a>
        <a class="text-btn nav-link" href="manage.html">文档管理</a>
        <a class="text-btn nav-link" href="governance.html">企业治理</a>
      </div>
    </header>
    <div class="scroll-area" id="scrollArea">
      <div class="welcome" id="welcome">
        <div class="welcome-mark">水</div>
        <h1>水利知识库智能问答</h1>
        <p>上传规程、报告或表格文档后，基于知识库内容提问。回答下方会标注引用的原文片段，支持多轮追问与会话分支。</p>
        <div class="quick-list">
          <button class="quick-item" onclick="quickAsk(this.textContent)">云溪水库的汛限水位是多少？</button>
          <button class="quick-item" onclick="quickAsk(this.textContent)">汛期入库流量超过2000时怎么调度？</button>
          <button class="quick-item" onclick="quickAsk(this.textContent)">云溪水库现在的实时水位是多少？</button>
          <button class="quick-item" onclick="quickAsk(this.textContent)">闸门开启有哪些操作原则？</button>
        </div>
      </div>
      <div class="messages" id="messages" style="display:none"></div>
    </div>
    <div class="composer-wrap">
      <div class="error-bar" id="errorBar" style="display:none"></div>
      <div class="composer">
        <textarea id="question" rows="1" placeholder="输入你的问题，Enter 发送，Shift+Enter 换行"></textarea>
        <button class="send-btn" id="sendBtn" onclick="send()">发送 <span style="opacity:.7">↵</span></button>
      </div>
      <div class="composer-tip">回答基于知识库生成，关键数据请以正式规程为准</div>
    </div>
  </main>
</div>
<div class="toast" id="toast"></div>

<script>
let sessions=[],currentId='',messages=[],sending=false;
function loadSessions(){
  try{sessions=JSON.parse(localStorage.getItem('water-rag-sessions')||'[]')}catch{sessions=[]}
  if(sessions.length){
    // 打开时定位到最近更新的会话，而不是数组里碰巧排第一的那个
    const latest=[...sessions].sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0))[0];
    switchSession(latest.id);
  }else{newSession()}
  renderSessions();
}
function saveSessions(){localStorage.setItem('water-rag-sessions',JSON.stringify(sessions))}
// 本地消息缓存：后端是权威源，缓存只用于切换会话时【立即】显示，避免闪烁/空白。
// 后端返回后用真实历史覆盖，两者不一致时以后端为准。
function cacheKey(id){return 'water-rag-msgs:'+id}
function cacheMessages(id){
  try{localStorage.setItem(cacheKey(id),JSON.stringify(messages.filter(m=>!m.streaming).map(m=>
    ({role:m.role,content:m.content,sources:m.sources||[]}))))}catch(e){}
}
function loadCached(id){
  try{return JSON.parse(localStorage.getItem(cacheKey(id))||'[]')}catch(e){return []}
}
function newSession(){
  const id='session-'+Date.now();sessions.unshift({id,title:'',updatedAt:Date.now()});saveSessions();switchSession(id);renderSessions();
}
function switchSession(id){
  if(currentId&&currentId!==id)cacheMessages(currentId); // 切走前先存当前会话
  currentId=id;
  messages=loadCached(id).map(m=>({...m,streaming:false})); // 立即显示缓存，无空白等待
  renderMessages();hideError();
  document.getElementById('treeLink').href='tree.html?sid='+encodeURIComponent(id);
  fetch('/api/chat/history?sessionId='+encodeURIComponent(id)).then(r=>r.json()).then(list=>{
    if(currentId!==id)return;
    // 后端有记录就以它为准；只有后端空且本地有内容时才保留缓存（应对写入时序）
    if(Array.isArray(list)&&list.length){
      messages=list.map(m=>({role:m.role,content:m.content,sources:m.sources||[],streaming:false}));
    }else if(!messages.length){
      messages=[];
    }
    cacheMessages(id);renderMessages();scrollBottom();
  }).catch(()=>{/* 网络失败时保留本地缓存，不清空 */});
  renderSessions();
}
function removeSession(id,ev){
  ev.stopPropagation();sessions=sessions.filter(s=>s.id!==id);saveSessions();
  if(!sessions.length){newSession();return}
  if(currentId===id)switchSession(sessions[0].id);else renderSessions();
}
function fmtSessionTime(ts){
  if(!ts)return '';
  const d=new Date(ts),now=new Date();
  if(isNaN(d.getTime()))return '';
  const hm=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  if(d.toDateString()===now.toDateString())return '今天 '+hm;
  const y=new Date(now);y.setDate(y.getDate()-1);
  if(d.toDateString()===y.toDateString())return '昨天 '+hm;
  return (d.getMonth()+1)+'/'+d.getDate()+' '+hm;
}
function touchSession(id){
  const s=sessions.find(x=>x.id===id);
  if(s){s.updatedAt=Date.now();saveSessions()}
}
function renderSessions(){
  const el=document.getElementById('sessionList');el.innerHTML='';
  // 按最近更新排序，活跃会话永远在最上面
  const sorted=[...sessions].sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));
  sorted.forEach(s=>{
    const div=document.createElement('div');
    div.className='session-item'+(s.id===currentId?' active':'');
    const short=(s.id||'').startsWith('session-')?s.id.slice(8,14):String(s.id||'').slice(0,8);
    div.innerHTML='<span class="session-dot"></span><span class="session-body">'+
      '<span class="session-name">'+escapeHtml(s.title||('会话 '+short))+'</span>'+
      '<span class="session-time">'+escapeHtml(fmtSessionTime(s.updatedAt))+'</span></span>'+
      '<button class="session-delete" title="删除本地会话">×</button>';
    div.onclick=()=>switchSession(s.id);
    div.querySelector('.session-delete').onclick=ev=>removeSession(s.id,ev);
    el.appendChild(div);
  });
}
function toast(msg,type){
  const t=document.getElementById('toast');
  t.textContent=msg;t.className='toast show'+(type?' '+type:'');
  clearTimeout(t._timer);t._timer=setTimeout(()=>t.classList.remove('show'),2600);
}

    const r=await fetch('/api/search/health');

function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function renderMarkdown(text){
  let h=escapeHtml(text);
  // 代码块先抽出占位，避免内部符号被后续规则误伤
  const codeBlocks=[];
  h=h.replace(/```([\s\S]*?)```/g,(m,code)=>{
    codeBlocks.push('<pre><code>'+code.replace(/^\n/,'')+'</code></pre>');
    return '\u0000CB'+(codeBlocks.length-1)+'\u0000';
  });
  h=h.replace(/`([^`\n]+)`/g,'<code>$1</code>');
  // GFM 表格：连续以 | 开头的行块，第二行必须是 |---|---| 分隔行
  h=h.replace(/(?:^\|.*\r?\n)+/gm,block=>{
    const rows=block.trim().split(/\r?\n/).map(r=>r.trim());
    if(rows.length<2||!/^\|[\s:|-]+\|?$/.test(rows[1]))return block;
    const cells=r=>r.replace(/^\|/,'').replace(/\|$/,'').split('|').map(c=>c.trim());
    let out='<table>';
    rows.forEach((r,i)=>{
      if(i===1)return; // 跳过分隔行
      const tag=i===0?'th':'td';
      out+='<tr>'+cells(r).map(c=>'<'+tag+'>'+c+'</'+tag+'>').join('')+'</tr>';
    });
    return out+'</table>';
  });
  // 标题：允许 ### 后无空格（大模型常输出"###一、"）
  h=h.replace(/^####\s*(.+)$/gm,'<h4>$1</h4>')
     .replace(/^###\s*(.+)$/gm,'<h3>$1</h3>')
     .replace(/^##\s*(.+)$/gm,'<h2>$1</h2>')
     .replace(/^#\s*(.+)$/gm,'<h1>$1</h1>');
  // 分隔线
  h=h.replace(/^---+\s*$/gm,'<hr>');
  h=h.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  h=h.replace(/^[-*] (.+)$/gm,'<li>$1</li>');
  // 列表包裹：清掉 li 之间及 </ul> 后紧跟的换行，否则后续 \n→<br> 会在列表内外渲染出多余空行
  h=h.replace(/(?:<li>.*<\/li>\n?)+/g,m=>'<ul>'+m.replace(/\n+/g,'')+'</ul>\n');
  // 连续空行压成一个换行（LLM 常输出多余空行，避免气泡里大片空白）
  h=h.replace(/\n{2,}/g,'\n');
  // 代码块占位还原要在 <br> 替换之前，避免 pre 内换行被改成 <br>
  h=h.replace(/\u0000CB(\d+)\u0000/g,(m,i)=>codeBlocks[i]);
  h=h.replace(/\n/g,'<br>');
  return '<div class="md-body">'+h+'</div>';
}
function renderMessages(){
  const box=document.getElementById('messages'),welcome=document.getElementById('welcome');
  welcome.style.display=messages.length?'none':'block';
  box.style.display=messages.length?'block':'none';box.innerHTML='';
  messages.forEach((m,i)=>{
    const row=document.createElement('div');
    row.className='message-row'+(m.role==='user'?' is-user':'');
    let inner='<div class="avatar '+(m.role==='user'?'avatar-user':'avatar-ai')+'">'+(m.role==='user'?'我':'AI')+'</div><div class="message-body">';
    inner+='<div class="message-sender">'+(m.role==='user'?'你':'水利知识库助手')+'</div>';
    if(m.role==='assistant'&&m.sources&&m.sources.length){
      const names=[...new Set(m.sources.map(s=>s.fileName))];
      const sum=names.length===1?names[0]:(names[0]+' 等 '+names.length+' 个文档');
      inner+='<div class="source-card"><button class="source-head" onclick="toggleSources('+i+')">'+
        '<span>▤</span><span class="source-title">参考了 '+m.sources.length+' 个知识片段 · '+escapeHtml(sum)+'</span>'+
        '<span id="arrow'+i+'">▾</span></button><div id="src'+i+'" class="source-list" style="display:none">';
      m.sources.forEach(s=>{
        inner+='<div class="source-item"><span class="source-file">'+escapeHtml(s.fileName)+'</span>'+
          '<span class="source-index">第 '+(Number(s.chunkIndex)+1)+' 段</span>'+
          '<div class="source-preview">'+escapeHtml(s.preview||'')+'</div></div>';
      });
      inner+='</div></div>';
    }
    const content=m.role==='user'?escapeHtml(m.content):renderMarkdown(m.content);
    inner+='<div class="message-bubble '+(m.role==='user'?'bubble-user':'bubble-ai')+'">'+content+
      (m.streaming?'<span class="cursor"></span>':'')+'</div></div>';
    row.innerHTML=inner;box.appendChild(row);
  });
}
function toggleSources(i){
  const el=document.getElementById('src'+i),open=el.style.display!=='none';
  el.style.display=open?'none':'block';
  document.getElementById('arrow'+i).textContent=open?'▾':'▴';
}
function scrollBottom(){const el=document.getElementById('scrollArea');el.scrollTop=el.scrollHeight}
function showError(msg){const el=document.getElementById('errorBar');el.textContent=msg;el.style.display='block'}
function hideError(){document.getElementById('errorBar').style.display='none'}
async function send(text){
  const q=(text||document.getElementById('question').value).trim();
  if(!q||sending)return;
  clearDraft();
  sending=true;document.getElementById('sendBtn').disabled=true;hideError();
  const session=sessions.find(s=>s.id===currentId);
  if(session&&!session.title){session.title=q.length>18?q.slice(0,18)+'…':q}
  touchSession(currentId);renderSessions(); // 更新会话时间并置顶
  messages.push({role:'user',content:q,sources:[],streaming:false});
  const ai={role:'assistant',content:'',sources:[],streaming:true};
  messages.push(ai);renderMessages();scrollBottom();
  try{
    const r=await fetch('/api/chat/stream',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({sessionId:currentId,question:q})
    });
    if(!r.ok)throw new Error('请求失败（HTTP '+r.status+'）');
    const reader=r.body.getReader(),dec=new TextDecoder();let buf='';
    while(true){
      const {done,value}=await reader.read();if(done)break;
      buf=(buf+dec.decode(value,{stream:true})).replace(/\r\n/g,'\n');
      let p;
      while((p=buf.indexOf('\n\n'))!==-1){
        const block=buf.slice(0,p);buf=buf.slice(p+2);
        let ev='message';const dataLines=[];
        block.split('\n').forEach(line=>{
          if(line.startsWith('event:'))ev=line.slice(6).trim();
          else if(line.startsWith('data:'))dataLines.push(line.slice(5).trim());
        });
        const data=dataLines.join('\n');
        if(ev==='sources'){try{ai.sources=JSON.parse(data)}catch(e){}}
        else if(ev==='message'){ai.content+=data;renderMessages();scrollBottom()}
      }
    }
  }catch(e){
    showError(e.message);
    if(!ai.content)ai.content='（请求失败，请检查后端服务与 API Key 配置）';
  }finally{
    ai.streaming=false;sending=false;
    document.getElementById('sendBtn').disabled=false;
    cacheMessages(currentId); // 回答一结束就落本地缓存，切换会话立即能看到
    renderMessages();scrollBottom();
  }
}

const dropzone=document.getElementById('dropzone');
dropzone.onclick=()=>document.getElementById('fileInput').click();
dropzone.ondragover=e=>{e.preventDefault();dropzone.classList.add('dragging')};
dropzone.ondragleave=e=>{e.preventDefault();dropzone.classList.remove('dragging')};
dropzone.ondrop=e=>{
  e.preventDefault();dropzone.classList.remove('dragging');
  const items=e.dataTransfer.items;
  // 拖的是文件夹：用 webkitGetAsEntry 递归收集所有文件再走批量入库
  if(items&&items.length&&items[0]&&items[0].webkitGetAsEntry){
    const files=[];
    (async()=>{
      for(const item of items){
        const entry=item.webkitGetAsEntry();
        if(entry)await walkEntry(entry,files);
      }
      if(files.length===1)uploadFile(files[0]);
      else if(files.length)uploadFolderFiles(files);
    })();
  }else{
    uploadFile(e.dataTransfer.files[0]);
  }
};
// 递归遍历拖入的文件/目录条目（readEntries 每次最多返回 100 条，需循环读完）
function walkEntry(entry,out){
  return new Promise(resolve=>{
    if(entry.isFile){
      entry.file(f=>{out.push(f);resolve()},()=>resolve());
    }else if(entry.isDirectory){
      const reader=entry.createReader();
      const readBatch=()=>{
        reader.readEntries(async ents=>{
          if(!ents.length){resolve();return}
          for(const en of ents)await walkEntry(en,out);
          readBatch();
        },()=>resolve());
      };
      readBatch();
    }else resolve();
  });
}
document.getElementById('fileInput').onchange=e=>{uploadFile(e.target.files[0]);e.target.value=''};
// 文件夹选择：webkitdirectory 返回文件夹内全部文件（含子目录，带相对路径）
document.getElementById('folderInput').onchange=e=>{uploadFolderFiles([...e.target.files]);e.target.value=''};
async function uploadFile(file){
  if(!file)return;
  const msg=document.getElementById('uploadMsg');
  msg.className='upload-msg';msg.style.display='block';
  const oversize=sizeError(file);
  if(oversize){msg.className='upload-msg err';msg.textContent='✗ '+file.name+'：'+oversize;return}
  msg.textContent='正在解析 '+file.name+'（'+fmtSize(file.size)+'）...';
  const fd=new FormData();fd.append('file',file);
  const started=Date.now();
  try{
    const r=await fetch('/api/docs/upload',{method:'POST',body:fd});
    const j=await r.json();
    // 双保险：错误响应缺 chunks 字段时按失败处理（后端已修复状态码，这里兜旧版本）
    if(!r.ok||j.chunks===undefined)throw new Error(j.message||('上传失败（HTTP '+r.status+'）'));
    const secs=((Date.now()-started)/1000).toFixed(1);
    // 完成提示持久显示（不自动消失），上传下一个文件时才被替换
    msg.className='upload-msg ok';
    msg.textContent='✓ 解析完成：'+file.name+' 共 '+j.chunks+' 个切片（'+j.chars+' 字），耗时 '+secs+' 秒，已可提问';
    toast('文档已入库，现在可以提问了','ok');
    loadDocs();
  }catch(e){
    msg.className='upload-msg err';
    msg.textContent='✗ '+file.name+' 入库失败：'+e.message;
  }
}
// ===== 文件夹批量上传 =====
// 支持格式集合（formats 接口加载后填充；文件夹过滤用）
let supportedExts=new Set();
// 单文件大小上限（字节，formats 接口返回；0/undefined 表示未知、跳过前端校验）
let maxFileBytes=0;
const fmtSize=b=>b>=1073741824?(b/1073741824).toFixed(1)+'GB':(b/1048576).toFixed(1)+'MB';
// 前端预检：超限直接给可读报错，不打一次无效 round-trip
const sizeError=f=>maxFileBytes&&f.size>maxFileBytes
    ?'文件 '+fmtSize(f.size)+' 超过单文件上限 '+fmtSize(maxFileBytes)
    :null;
// 系统垃圾文件：即使后缀碰巧受支持也不入库
const JUNK_FILES=new Set(['desktop.ini','thumbs.db','.ds_store','~$temp.hta']);
const isJunkFile=name=>name.startsWith('.')||JUNK_FILES.has(name.toLowerCase());

async function uploadFolderFiles(all){
  const msg=document.getElementById('uploadMsg');
  msg.className='upload-msg';msg.style.display='block';
  if(!all.length){msg.className='upload-msg err';msg.textContent='✗ 文件夹是空的';return}
  // 支持格式未加载时兜底拉一次
  if(!supportedExts.size){
    try{const d=await (await fetch('/api/docs/formats')).json();supportedExts=new Set(d.extensions)}catch(e){}
  }
  const files=all.filter(f=>{
    if(isJunkFile(f.name))return false;
    const i=f.name.lastIndexOf('.');
    return i>=0&&supportedExts.has(f.name.slice(i+1).toLowerCase());
  });
  const skipFmt=all.length-files.length;
  if(!files.length){
    msg.className='upload-msg err';
    msg.textContent='✗ 文件夹中没有支持的文档格式（共 '+all.length+' 个文件全部跳过）';
    return;
  }
  // 已在知识库的文件跳过：文件夹重复上传不会产生重复切片
  let existing=new Set();
  try{existing=new Set((await (await fetch('/api/docs/list')).json()).map(d=>d.fileName))}catch(e){}
  let ok=0,skipExist=0,fail=0;const errs=[];
  for(let i=0;i<files.length;i++){
    const f=files[i];
    if(existing.has(f.name)){
      skipExist++;
      msg.textContent='['+(i+1)+'/'+files.length+'] '+f.name+' 已在知识库，跳过';
      continue;
    }
    msg.textContent='['+(i+1)+'/'+files.length+'] 正在解析 '+f.name+'（'+fmtSize(f.size)+'）...';
    const oversize=sizeError(f);
    if(oversize){
      fail++;errs.push(f.name+'：'+oversize);
      msg.textContent='['+(i+1)+'/'+files.length+'] ✗ '+f.name+'：'+oversize;
      continue;
    }
    const fd=new FormData();fd.append('file',f);
    try{
      const r=await fetch('/api/docs/upload',{method:'POST',body:fd});
      const j=await r.json();
      if(!r.ok||j.chunks===undefined)throw new Error(j.message||('上传失败（HTTP '+r.status+'）'));
      ok++;
      msg.textContent='['+(i+1)+'/'+files.length+'] ✓ '+f.name+'（'+j.chunks+' 切片）';
    }catch(err){
      fail++;errs.push(f.name+'：'+err.message);
      msg.textContent='['+(i+1)+'/'+files.length+'] ✗ '+f.name+'：'+err.message;
    }
  }
  loadDocs();
  let summary='✓ 文件夹入库完成：成功 '+ok+'，跳过已有 '+skipExist;
  if(skipFmt)summary+='，格式不支持 '+skipFmt;
  if(fail)summary+='，失败 '+fail+' 个：'+errs[0]+(errs.length>1?' 等':'');
  msg.className=fail?'upload-msg err':'upload-msg ok';
  msg.textContent=summary;
}

// ===== 知识库文档清单（侧栏只显示最新 2 条，全部列表去管理页）=====
const SIDEBAR_DOC_LIMIT=2;
async function loadDocs(){
  const el=document.getElementById('docList');
  try{
    const all=await (await fetch('/api/docs/list')).json();
    // 按上传时间倒序（uploadedAt 是 ISO 字符串，可直接字典序比较）
    const list=[...all].sort((a,b)=>String(b.uploadedAt||'').localeCompare(String(a.uploadedAt||'')));
    el.innerHTML='';
    if(!list.length){el.innerHTML='<div class="doc-empty">知识库暂无文档，先上传一份吧</div>';return}
    const renderDoc=d=>{
      const item=document.createElement('div');
      item.className='doc-item';
      item.innerHTML='<span class="doc-name" title="'+escapeHtml(d.fileName)+'">'+escapeHtml(d.fileName)+'</span>'+
        '<span class="doc-meta">'+d.chunks+'片</span>'+
        '<button class="doc-delete" title="从知识库删除该文档">×</button>';
      item.querySelector('.doc-delete').onclick=()=>{
        if(!confirm('确定从知识库删除「'+d.fileName+'」（'+d.chunks+' 个切片）吗？'))return;
        fetch('/api/docs?fileName='+encodeURIComponent(d.fileName),{method:'DELETE'})
          .then(r=>r.json()).then(j=>{
            if(!j.deletedChunks&&j.deletedChunks!==0)throw new Error(j.message||'删除失败');
            loadDocs();
            const msg=document.getElementById('uploadMsg');
            msg.className='upload-msg ok';msg.style.display='block';
            msg.textContent='✓ 已删除「'+d.fileName+'」（'+j.deletedChunks+' 个切片）';
          }).catch(e=>{
            const msg=document.getElementById('uploadMsg');
            msg.className='upload-msg err';msg.style.display='block';
            msg.textContent='✗ 删除失败：'+e.message;
          });
      };
      el.appendChild(item);
    };
    list.slice(0,SIDEBAR_DOC_LIMIT).forEach(renderDoc);
    if(list.length>SIDEBAR_DOC_LIMIT){
      const more=document.createElement('a');
      more.className='doc-more';
      more.href='manage.html';
      more.textContent='查看全部 '+list.length+' 个文档 →';
      el.appendChild(more);
    }
  }catch(e){el.innerHTML='<div class="doc-empty">文档列表加载失败</div>'}
}
fetch('/api/docs/formats').then(r=>r.json()).then(d=>{
  supportedExts=new Set(d.extensions);
  maxFileBytes=d.maxFileSizeBytes||0;
  const exts=d.extensions;
  // 侧栏只展示前 10 种，完整清单放悬停提示
  document.getElementById('dropFormats').textContent=exts.slice(0,10).join(' / ')+' 等 '+exts.length+' 种格式';
  document.getElementById('dropFormats').title=exts.join(' / ');
}).catch(()=>{});
loadSessions();
loadDocs();
checkHealth();
setInterval(checkHealth,30000); // 每 30 秒探活，服务挂了能立刻看到
</script>
