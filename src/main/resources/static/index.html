<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>水利知识库智能问答系统</title>
<link rel="icon" type="image/svg+xml" href="assets/logo.svg">
<link rel="stylesheet" href="assets/app.css">
<style>
  :root{
    --navy:#111c33;--navy-2:#18253f;--navy-3:#22304d;
    --primary:#3b6ef5;--primary-hi:#5b8bff;--primary-soft:#eaf1ff;
    --ink:#1b2436;--ink-2:#475569;--muted:#8a95a8;--line:#e7ebf2;
    --bg:#f5f7fb;--white:#fff;--ok:#0e9f6e;--danger:#e0245e;
    --shadow-sm:0 1px 3px rgba(16,28,54,.06);
    --shadow-md:0 8px 24px rgba(16,28,54,.08);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);background:var(--bg);font-size:14px;-webkit-font-smoothing:antialiased}
  button,input,textarea{font-family:inherit}
  button{cursor:pointer}
  button:disabled{cursor:not-allowed;opacity:.55}

  /* ============ 布局 ============ */
  .layout{display:flex;height:100vh;overflow:hidden}

  /* ============ 主区 ============ */
  .main{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg)}
  .topbar{height:64px;flex:0 0 64px;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;box-shadow:var(--shadow-sm)}
  .topbar-left{display:flex;align-items:center;gap:11px}
  .topbar-title{font-size:15px;font-weight:650;color:var(--ink)}
  .status-pill{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--ok);background:#e8f8f1;border:1px solid #c6ecd9;padding:4px 10px;border-radius:20px;font-weight:500}
  .status-dot{width:6px;height:6px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(14,159,110,.15)}
  .status-pill.off{color:var(--danger);background:#fdeef3;border-color:#f8cfdc}
  .status-pill.off .status-dot{background:var(--danger);box-shadow:0 0 0 3px rgba(224,36,94,.14)}
  .topbar-nav{display:flex;align-items:center;gap:7px}
  .text-btn{border:1px solid var(--line);background:#fff;color:var(--ink-2);padding:7px 12px;border-radius:8px;font-size:12px;transition:all .15s;text-decoration:none;display:inline-block;line-height:1.3;white-space:nowrap}
  .text-btn:hover{border-color:#b9cbff;color:var(--primary);background:var(--primary-soft)}
  .nav-link{line-height:1.3}

  /* 不做平滑滚动/入场动画：流式输出时反复触发会造成肉眼可见的抖动 */
  .scroll-area{flex:1;overflow-y:auto;padding:32px 6% 24px}
  .welcome{max-width:760px;margin:8vh auto 0;text-align:center}
  .welcome-mark{width:62px;height:62px;border-radius:17px;background:linear-gradient(135deg,var(--primary-hi),var(--primary));color:#fff;font-size:26px;font-weight:700;display:flex;align-items:center;justify-content:center;margin:0 auto 20px;box-shadow:0 10px 28px rgba(59,110,245,.3)}
  /* 欢迎区用项目图标（水滴水波）代替一个"水"字：字标在不同字号下重心会飘 */
  .welcome-mark.has-logo{background:none;box-shadow:none;padding:0}
  .welcome-mark.has-logo .brand-logo{width:62px;height:62px;border-radius:17px;box-shadow:0 10px 28px rgba(59,110,245,.28)}
  .quick-tip{font-size:11px;color:var(--muted);margin-top:14px;letter-spacing:.2px}
  .welcome h1{font-size:23px;color:var(--ink);margin:0 0 11px;font-weight:680;letter-spacing:.3px}
  .welcome p{font-size:13.5px;color:var(--ink-2);line-height:1.8;margin:0 auto 30px;max-width:560px}
  .quick-list{display:grid;grid-template-columns:1fr 1fr;gap:11px;max-width:660px;margin:0 auto}
  .quick-item{border:1px solid var(--line);background:#fff;border-radius:11px;padding:14px 16px;font-size:13px;color:var(--ink-2);text-align:left;box-shadow:var(--shadow-sm);transition:all .18s;line-height:1.5}
  .quick-item:hover{border-color:#b9cbff;background:var(--primary-soft);color:var(--primary);transform:translateY(-2px);box-shadow:0 6px 18px rgba(59,110,245,.12)}
  .quick-item::before{content:'✦';color:var(--primary);margin-right:8px;font-size:11px}

  /* ============ 消息区（WorkBuddy 式：对话列居中限宽，不做全铺满） ============ */
  .messages{max-width:880px;margin:0 auto}
  .msg-group{margin-bottom:32px}
  .msg-group.user{display:flex;justify-content:flex-end}
  /* 用户气泡：宽度有上限，超宽屏不拉成横幅，保持对话气泡形态 */
  .user-bubble{max-width:min(78%,760px);background:var(--primary-soft);color:#1e3a8a;border:1px solid #d6e4ff;border-radius:14px 14px 4px 14px;padding:12px 18px;font-size:14px;line-height:1.7;white-space:pre-wrap;box-shadow:var(--shadow-sm)}
  /* 回答卡片：占满主区，内部三层（标题栏/正文/引用）用底色与分隔线分层；
     正文限舒适行宽靠左排版——宽屏长文一行可读性优先，右侧留白是排版呼吸空间 */
  .ai-card{background:#fff;border:1px solid var(--line);border-left:3px solid var(--primary);border-radius:12px;box-shadow:var(--shadow-sm);overflow:hidden}
  .ai-card-head{display:flex;align-items:center;gap:9px;padding:11px 18px;background:#fbfcfe;border-bottom:1px solid #f1f4f9;font-size:11.5px;color:var(--muted)}
  .ai-badge{width:22px;height:22px;border-radius:7px;background:linear-gradient(135deg,var(--primary-hi),var(--primary));color:#fff;display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;flex:0 0 22px}
  .ai-card-name{font-weight:650;color:var(--ink-2);letter-spacing:.2px}
  .ai-state{margin-left:6px}
  .ai-card-actions{margin-left:auto;display:flex;align-items:center;gap:6px}
  /* 操作按钮常显：低对比极简图标在浅底上近乎隐形，用户会以为"要 hover 才出来" */
  .icon-btn{border:1px solid #e6eaf1;background:#fff;color:#6b7789;height:24px;padding:0 8px;border-radius:6px;font-size:12px;line-height:1;transition:all .15s;display:inline-flex;align-items:center;justify-content:center;white-space:nowrap}
  .icon-btn:hover{border-color:#b9cbff;background:var(--primary-soft);color:var(--primary)}
  /* 本次调用的消耗：单次问答的 token 与耗时，属于"响应元数据"，放标题栏右侧最合适；
     数字用 tabular-nums 对齐，连续问答时纵向扫视不会跳动 */
  .ai-usage{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 8px;margin-right:2px;
    border:1px solid #e8edf6;border-radius:6px;background:#f5f8fd;color:#7a8699;
    font-size:10.5px;font-weight:500;letter-spacing:.1px;font-variant-numeric:tabular-nums;
    white-space:nowrap;cursor:default;transition:all .15s}
  .ai-usage:hover{background:#eef4ff;border-color:#d3e0fa;color:#3b6ef5}
  .ai-usage b{font-weight:700;color:#475569}
  .ai-usage:hover b{color:#2f5fe0}
  .ai-usage .ai-usage-sep{color:#c3cddd;font-weight:400}
  /* 引用计数是"▤ N 篇"文字按钮，必须自适应宽度且不换行 */
  .ai-cite-count{font-size:11px;letter-spacing:.2px}
  .ai-card-body{padding:16px 22px 18px;font-size:14px;line-height:1.85;color:var(--ink)}
  /* 引用区：按文档去重后的角标行，与正文用细分隔线 + 淡底色区分 */
  .cite-zone:not(:empty){border-top:1px solid #f1f4f9;padding:13px 22px 15px;background:#fafbfe}
  .cite-row{display:flex;flex-wrap:wrap;gap:7px}
  .cite-chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;color:var(--ink-2);border-radius:7px;padding:5px 9px;font-size:11.5px;cursor:pointer;transition:all .15s;max-width:300px}
  .cite-chip:hover{background:var(--primary-soft);border-color:#b9cbff;color:#25469b}
  .cite-num{background:var(--primary);color:#fff;border-radius:5px;padding:1px 6px;font-size:10px;font-weight:700;flex:0 0 auto}
  .cite-file{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cite-multi{flex:0 0 auto;font-size:10px;color:#8a95a8;background:#f1f4f9;border-radius:9px;padding:1px 6px}
  .cite-preview{border:1px solid var(--line);margin-top:10px;padding:6px 12px;background:#fff;border-radius:8px;font-size:12px;color:var(--ink-2);line-height:1.7;display:none}
  .cite-seg{padding:8px 0;border-bottom:1px dashed #eef1f6}
  .cite-seg:last-child{border-bottom:0}
  .cite-seg-no{display:inline-block;font-size:10.5px;color:#3568d4;background:#e8f0ff;border-radius:8px;padding:1px 7px;margin-right:8px}
  .cite-preview.open{display:block}
  .cursor{display:inline-block;width:7px;height:15px;background:var(--primary);vertical-align:text-bottom;margin-left:2px;animation:blink 1s steps(2) infinite}
  @keyframes blink{50%{opacity:0}}

  /* ============ 输入区（WorkBuddy 式：与对话列同宽居中 + 底部工具栏） ============ */
  .composer-wrap{flex:0 0 auto;padding:14px 6% 16px;background:linear-gradient(transparent,var(--bg) 18%)}
  .error-bar{max-width:880px;margin:0 auto 9px;padding:9px 13px;border-radius:8px;background:#fdeef3;color:#b91c4a;font-size:12.5px;border:1px solid #f8cfdc;box-shadow:var(--shadow-sm)}
  .composer{max-width:880px;margin:0 auto;background:#fff;border:1px solid #d9e0ec;border-radius:16px;box-shadow:var(--shadow-md);transition:all .18s;padding:15px 17px 11px}
  .composer:focus-within{border-color:var(--primary);box-shadow:0 0 0 4px rgba(59,110,245,.1),var(--shadow-md)}
  .composer textarea{width:100%;resize:none;border:0;outline:0;font-size:15px;line-height:1.65;max-height:160px;min-height:28px;color:var(--ink);background:transparent;display:block}
  .composer-bar{display:flex;align-items:center;gap:8px;margin-top:11px;padding-top:10px;border-top:1px solid #f0f3f8}
  .composer-tool{border:1px solid transparent;background:transparent;color:var(--muted);font-size:12px;padding:5px 9px;border-radius:7px;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
  .composer-tool:hover{background:var(--primary-soft);color:var(--primary);border-color:#dbe5ff}
  .send-btn{border:0;background:linear-gradient(135deg,var(--primary-hi),var(--primary));color:#fff;padding:8px 18px;border-radius:10px;font-size:12.5px;font-weight:600;transition:all .18s;box-shadow:0 3px 10px rgba(59,110,245,.28);display:flex;align-items:center;gap:6px;margin-left:auto}
  .send-btn:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 5px 16px rgba(59,110,245,.36)}
  .composer-tip{text-align:center;font-size:10.5px;color:var(--muted);margin-top:9px;letter-spacing:.2px}

  /* ============ Markdown 正文 ============ */
  .md-body p{margin:0 0 10px}.md-body p:last-child{margin-bottom:0}
  .md-body h1,.md-body h2,.md-body h3,.md-body h4{color:var(--ink);margin:14px 0 8px;line-height:1.4}
  .md-body h1{font-size:18px}.md-body h2{font-size:16px}.md-body h3{font-size:14.5px}
  .md-body ul,.md-body ol{margin:5px 0 7px;padding-left:22px}
  .md-body li{margin:2px 0}
  .md-body code{background:#eef2f8;padding:1px 5px;border-radius:4px;font-size:.9em;color:#b02a5b}
  .md-body table{border-collapse:collapse;margin:11px 0;font-size:.92em;max-width:100%;display:block;overflow-x:auto}
  .md-body th,.md-body td{border:1px solid #dbe2ee;padding:6px 11px;text-align:left}
  .md-body th{background:#f2f5fa;font-weight:650}
  .md-body hr{border:0;border-top:1px solid var(--line);margin:13px 0}
  .md-body pre{background:#111c33;color:#dbe4f5;padding:13px 15px;border-radius:9px;overflow-x:auto}
  .md-body pre code{background:transparent;padding:0;color:inherit}

  /* Toast 通知 */
  .toast{position:fixed;right:24px;bottom:24px;background:var(--navy);color:#fff;padding:12px 17px;border-radius:10px;font-size:12.5px;box-shadow:0 12px 32px rgba(16,28,54,.28);z-index:99;opacity:0;transform:translateY(12px);transition:all .25s;pointer-events:none;max-width:340px;line-height:1.5}
  .toast.show{opacity:1;transform:none}
  .toast.ok{background:linear-gradient(135deg,#0e9f6e,#0b8a60)}
  .toast.err{background:linear-gradient(135deg,#e0245e,#c41e50)}

  ::-webkit-scrollbar{width:8px;height:8px}
  ::-webkit-scrollbar-thumb{background:#cfd7e5;border-radius:4px}
  ::-webkit-scrollbar-thumb:hover{background:#b6c1d4}
  ::-webkit-scrollbar-track{background:transparent}
  .sidebar ::-webkit-scrollbar-thumb{background:#3b4b6b}

  @media(max-width:980px){
    .sidebar{width:230px;flex-basis:230px}
    .topbar-nav .text-btn{padding:6px 9px;font-size:11px}
    .quick-list{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<div class="layout" id="sidebarHost">

  <main class="main">
    <header class="topbar">
      <div class="topbar-left">
        <div class="topbar-title">知识库问答</div>

      </div>
      <div class="topbar-nav">
        <span id="adminEntrySlot" class="admin-slot"></span>
      </div>
    </header>
    <div class="scroll-area" id="scrollArea">
      <div class="welcome" id="welcome">
        <div class="welcome-mark has-logo"><img class="brand-logo" src="assets/logo.svg" alt=""></div>
        <h1>水利知识库智能问答</h1>
        <p>上传规程、报告或表格文档后，基于知识库内容提问。回答下方会标注引用的原文片段，支持多轮追问与会话分支。</p>
        <div class="quick-list">
          <button class="quick-item" onclick="fillAsk(this.textContent)">云溪水库的汛限水位是多少？</button>
          <button class="quick-item" onclick="fillAsk(this.textContent)">汛期入库流量超过2000时怎么调度？</button>
          <button class="quick-item" onclick="fillAsk(this.textContent)">云溪水库现在的实时水位是多少？</button>
          <button class="quick-item" onclick="fillAsk(this.textContent)">闸门开启有哪些操作原则？</button>
        </div>
        <div class="quick-tip">点击示例可填入输入框，改完再发送</div>
      </div>
      <div class="messages" id="messages" style="display:none"></div>
    </div>
    <div class="composer-wrap">
      <div class="error-bar" id="errorBar" style="display:none"></div>
      <div class="composer">
        <textarea id="question" rows="1" placeholder="输入你的问题，Enter 发送，Shift+Enter 换行"></textarea>
        <div class="composer-bar">
          <span class="composer-tool" title="基于知识库检索作答"><span style="color:var(--primary)">◈</span> 知识库问答</span>
          <button class="composer-tool" onclick="document.getElementById('fileInput').click()" title="上传文档到知识库">⇪ 上传文档</button>
          <button class="send-btn" id="sendBtn" onclick="send()">发送 <span style="opacity:.75">↵</span></button>
        </div>
      </div>
      <div class="composer-tip">回答基于知识库生成，关键数据请以正式规程为准</div>
    </div>
  </main>
</div>
<div class="toast" id="toast"></div>

<script src="assets/auth.js"></script>
<script src="assets/app.js"></script>
<script>
let sessions=[],currentId='',messages=[],sending=false;
// 所有本地数据按登录账号分区：换账号登录不会看到上一个账号的会话、消息和草稿
const SCOPE=(window.WrkAuth&&WrkAuth.scope)?WrkAuth.scope():'demo';
function sessionKey(){return 'water-rag-sessions:'+SCOPE}
// ===== 会话列表：唯一真源是 localStorage =====
// 页面内不再维护"可写副本"：每次改动都走「读—改—写」。
// 之前是内存里存一份 sessions、改完整体写回，结果侧栏删掉的会话会被这份过期副本
// 在下次发消息 / 新建会话时整份覆盖回去——这才是"删了又自己回来"的真正根因。
function readSessions(){sessions=Shell.getSessions();return sessions}
function writeSessions(list){Shell.saveSessions(list);sessions=list}
// 启动顺序很关键：会话清单已改为"服务端为准"，
// 必须等一次清单回来再决定"要不要新建会话"，否则换了浏览器打开页面时，
// 本地缓存是空的 → 先建了个空会话 → 服务端历史姗姗来迟，用户看到的是空白新会话。
let booting=true;
function loadSessions(){
  sessions=Shell.getSessions();
  // 支持从功能页侧栏跳回：?sid=xxx 定位指定会话，?new=1 直接新建会话
  const params=new URLSearchParams(location.search);
  const sid=params.get('sid');
  if(params.get('new')==='1'){newSession();renderSessions();return}
  if(sid&&sessions.some(s=>s.id===sid)){switchSession(sid);renderSessions();return}
  if(sessions.length){
    // 打开时定位到最近更新的会话，而不是数组里碰巧排第一的那个
    const latest=[...sessions].sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0))[0];
    switchSession(latest.id);
  }else if(!booting){
    // 服务端清单确实为空才建新会话；还在等清单就先别动手
    newSession();
  }
  renderSessions();
}
// ============ 按会话隔离的状态（核心：所有会话状态互不干扰）============
// msgStore[sid] = 该会话的消息数组；草稿也按 sid 存，切换会话绝不串台。
let msgStore=Object.create(null);
let historySeq=0; // 会话切换请求序号，忽略过期响应，避免闪屏
function cacheKey(id){return 'water-rag-msgs:'+SCOPE+':'+id}
function draftKey(id){return 'water-rag-draft:'+SCOPE+':'+id}
function cacheMessages(id,list){
  try{const arr=list||msgStore[id]||[];
    // usage 一并缓存：刷新页面后历史回答的"本次消耗"仍然显示，不会凭空消失
    // nodeId/parentId 也存：离线打开缓存时「从这里再问」仍知道该回退到哪个节点
    localStorage.setItem(cacheKey(id),JSON.stringify(arr.filter(m=>!m.streaming).map(m=>
      ({role:m.role,content:m.content,sources:m.sources||[],usage:m.usage||null,
        nodeId:m.nodeId||'',parentId:m.parentId||''}))))}catch(e){}
}
function loadCached(id){
  try{const a=JSON.parse(localStorage.getItem(cacheKey(id))||'[]');return Array.isArray(a)?a:[]}catch(e){return []}
}
function storeOf(id){
  if(!msgStore[id])msgStore[id]=loadCached(id).map(m=>({...m,streaming:false}));
  return msgStore[id];
}
function newSession(){
  const id='session-'+Date.now()+'-'+Math.random().toString(36).slice(2,6);
  const list=readSessions();                              // 先读最新，避免用过期副本覆盖
  list.unshift({id,title:'',updatedAt:Date.now()});
  writeSessions(list);
  // 立刻在服务端登记：否则刷新时服务端清单里没有它，会被同步逻辑当成已删除
  if(window.Shell)Shell.pushSessionRemote(id,'');
  switchSession(id);renderSessions();
}
function switchSession(id){
  if(currentId&&currentId!==id){
    cacheMessages(currentId);                              // 存旧会话消息
    try{sessionStorage.setItem(draftKey(currentId),draftBox.value)}catch(e){} // 存旧会话草稿
  }
  currentId=id;
  messages=storeOf(id);                                   // 切到目标会话自己的数组
  renderMessages();hideError();
  scrollBottom(true);                                     // 切换会话强制瞬时到底（无平滑动画）
  syncDraft();                                            // 恢复目标会话草稿
  // 注意：这里原来有一句把会话 id 写进 treeLink 的代码，但 treeLink 元素早已随
  // 「问答分支」入口一起删掉，getElementById 返回 null 会抛 TypeError，
  // 把后面的后端历史加载整段打断（刷新后只剩本地缓存）。别再往这里加依赖 DOM 的语句。
  const seq=++historySeq;
  fetch('/api/chat/history?sessionId='+encodeURIComponent(id)).then(r=>r.json()).then(list=>{
    if(currentId!==id||seq!==historySeq)return;            // 已切走或有过期的旧请求，忽略
    if(!Array.isArray(list))return;
    // 流式输出中后端历史还不完整，等回答结束再对齐，避免打断/闪屏
    if(messages.some(m=>m.streaming))return;
    const sig=a=>JSON.stringify(a.map(m=>[m.role,m.content]));
    const fresh=list.map(m=>({role:m.role,content:m.content,sources:m.sources||[],streaming:false,
      nodeId:m.id||'',parentId:m.parentId||''}));
    if(sig(fresh)===sig(messages))return;                  // 内容一致就不重绘，消除二次渲染闪烁
    messages=fresh;msgStore[id]=messages;
    cacheMessages(id);renderMessages();scrollBottom(true);
  }).catch(()=>{});
  renderSessions();
}
// 注意：这里原来有个本地版 removeSession（只删内存+localStorage），侧栏 DOM 早已由
// app.js 统一渲染并绑定它自己的删除逻辑（含后端历史清理），本地这份是死代码且逻辑过时，已删除。
function fmtSessionTime(ts){
  if(!ts)return '';
  const d=new Date(ts),now=new Date();
  if(isNaN(d.getTime()))return '';
  const hm=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  if(d.toDateString()===now.toDateString())return '今天 '+hm;
  const y=new Date(now);y.setDate(y.getDate()-1);
  if(d.toDateString()===y.toDateString())return '昨天 '+hm;
  return (d.getMonth()+1)+'/'+d.getDate()+' '+hm;
}
// 更新会话活跃时间；title 传了且会话还没有标题时顺便补上（首个问题即标题）
function touchSession(id,title){
  const list=readSessions();
  const s=list.find(x=>x.id===id);
  if(!s)return;
  // 先判断"这次是不是首次产生标题"再赋值：赋值后再判断永远是 false
  const firstTitle=!!(title&&!s.title);
  if(firstTitle)s.title=title;
  s.updatedAt=Date.now();
  writeSessions(list);
  // 同步到服务端：只在首次产生标题时把标题发上去，其余情况只刷新时间戳，
  // 免得把用户后来手动改的名字覆盖回第一个问题
  if(window.Shell)Shell.patchSessionRemote(id,firstTitle?title:'');
}
// 会话列表 DOM 由公共组件 app.js 统一渲染；这里只同步当前会话高亮。
// 数据仍在本地 sessions 变量（与公共层同源 localStorage），问答逻辑照常使用。
function renderSessions(){
  if(window.Shell)Shell.setSession(currentId);
  // 自愈：当前停留的会话如果已经不在了（比如刚在侧栏删掉），立刻切到列表里最新的一条。
  // 不能只依赖删除钩子——钩子只是"通知"，视图正确性应该由渲染这步兜住。
  const list=Shell.getSessions();
  if(currentId&&!list.some(s=>s.id===currentId)){
    if(list.length)switchSession(list[0].id);
    else if(!sending)newSession();
  }
}
function toast(msg,type){

function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function renderMarkdown(text){
  let h=escapeHtml(text);
  // 代码块先抽出占位，避免内部符号被后续规则误伤
  const codeBlocks=[];
  h=h.replace(/```([\s\S]*?)```/g,(m,code)=>{
    codeBlocks.push('<pre><code>'+code.replace(/^\n/,'')+'</code></pre>');
    return '\u0000CB'+(codeBlocks.length-1)+'\u0000';
  });
  h=h.replace(/`([^`\n]+)`/g,'<code>$1</code>');
  // GFM 表格：连续以 | 开头的行块，第二行必须是 |---|---| 分隔行
  h=h.replace(/(?:^\|.*\r?\n)+/gm,block=>{
    const rows=block.trim().split(/\r?\n/).map(r=>r.trim());
    if(rows.length<2||!/^\|[\s:|-]+\|?$/.test(rows[1]))return block;
    const cells=r=>r.replace(/^\|/,'').replace(/\|$/,'').split('|').map(c=>c.trim());
    let out='<table>';
    rows.forEach((r,i)=>{
      if(i===1)return; // 跳过分隔行
      const tag=i===0?'th':'td';
      out+='<tr>'+cells(r).map(c=>'<'+tag+'>'+c+'</'+tag+'>').join('')+'</tr>';
    });
    return out+'</table>';
  });
  // 标题：允许 ### 后无空格（大模型常输出"###一、"）
  h=h.replace(/^####\s*(.+)$/gm,'<h4>$1</h4>')
     .replace(/^###\s*(.+)$/gm,'<h3>$1</h3>')
     .replace(/^##\s*(.+)$/gm,'<h2>$1</h2>')
     .replace(/^#\s*(.+)$/gm,'<h1>$1</h1>');
  // 分隔线
  h=h.replace(/^---+\s*$/gm,'<hr>');
  h=h.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  h=h.replace(/^[-*] (.+)$/gm,'<li>$1</li>');
  // 列表包裹：清掉 li 之间及 </ul> 后紧跟的换行，否则后续 \n→<br> 会在列表内外渲染出多余空行
  h=h.replace(/(?:<li>.*<\/li>\n?)+/g,m=>'<ul>'+m.replace(/\n+/g,'')+'</ul>\n');
  // 连续空行压成一个换行（LLM 常输出多余空行，避免气泡里大片空白）
  h=h.replace(/\n{2,}/g,'\n');
  // 代码块占位还原要在 <br> 替换之前，避免 pre 内换行被改成 <br>
  h=h.replace(/\u0000CB(\d+)\u0000/g,(m,i)=>codeBlocks[i]);
  h=h.replace(/\n/g,'<br>');
  return '<div class="md-body">'+h+'</div>';
}
// 单条消息 HTML。AI 卡片内预留 .cite-zone / .ai-state / .ai-cite-count 便于【增量】更新，
// 流式输出时不再重建整列 DOM，从根上消除闪烁。
function fmtInt(n){return Number(n||0).toLocaleString('en-US')}
// 本次调用的消耗：主显示"合计 token + 耗时"，明细（输入/输出/模型）放 title 悬浮提示。
// 只显示合计是为了标题栏不拥挤；需要核对输入输出时鼠标一悬停就有。
function usageInner(u){

function usageTip(u){

// 结构渲染：一次性赋值完整 HTML，避免逐条 append 的多帧空白。只在切换会话/新增/清空时调用。
function renderMessages(){
  const box=document.getElementById('messages'),welcome=document.getElementById('welcome');

/**
 * 把"引导式提问示例"变成可点击项。
 *
 * <p>判定条件刻意收得很窄：只有紧跟在含「例如/示例/比如/可以这样问」的段落之后的列表，
 * 其条目才算示例。普通的要点列表（调度原则、参数清单）不能被误标成可点击，
 * 否则用户点一下就把"3.2 米"这种碎片填进输入框了。</p>
 */
function markAskHints(root){
  if(!root)return;
  root.querySelectorAll('.md-body ul').forEach(ul=>{
    // renderMarkdown 不给段落加 <p>，换行只被换成 <br>；所以不能只看 previousElementSibling，
    // 要先跨过紧贴的 <br>，再读它前面那一段连续文本（就是"……例如："这句引导语）。
    let n=ul.previousSibling;
    while(n&&n.nodeName==='BR')n=n.previousSibling;
    let txt='';
    while(n&&n.nodeType===3&&txt.length<160){txt=n.textContent+txt;n=n.previousSibling;}
    if(!/例如|示例|比如|可以这样问|试试/.test(txt))return;
    ul.querySelectorAll('li').forEach(li=>{
      const q=li.textContent.trim().replace(/[；;。]$/,'').trim();
      if(!q||q.length>40)return;         // 太长的不是示例句，是可点击会误导的整段话
      li.classList.add('ask-hint');
      li.title='点击填入输入框';
      li.onclick=()=>fillAsk(q);
    });
  });
}
/** 把一句话填进输入框并聚焦，由用户自己决定发不发 */
function fillAsk(q){

/**
 * 从这里再问：回退到该轮问题的父节点（新问题成为同级分支），并把原问题填回输入框。
 *
 * <p>回退后用 /api/chat/history 重新拉当前分支链，让画面同步收缩到那一轮——
 * 否则新问题会接在末尾，看起来像是接着最后一条继续问，与"重新问"的语义不符。
 * 旧分支节点一个都没删，仍可在「会话结构」页切回去。</p>
 */
/**
 * 补齐当前会话消息的 nodeId/parentId。
 *
 * <p>老缓存（本轮之前的版本）与从服务端恢复的历史可能缺 id，缺 id 就定位不到父节点。
 * 长度对得上才回填——对不上说明中途有过截断，宁可放弃也不能错位。</p>
 */
async function syncMsgIds(sessionId){
  try{
    const r=await fetch('/api/chat/history?sessionId='+encodeURIComponent(sessionId));
    if(!r.ok)return false;
    const list=await r.json();
    const store=storeOf(sessionId);
    if(!Array.isArray(list)||list.length!==store.length)return false;
    list.forEach((m,k)=>{store[k].nodeId=m.id||'';store[k].parentId=m.parentId||'';});
    cacheMessages(sessionId,store);
    return true;
  }catch(e){return false}
}
async function rewindAsk(i){
  const q=messages[i-1];
  if(!q||q.role!=='user'){toast('这一轮缺少问题内容，无法回退','err');return}
  const ownerId=currentId;
  let parentId=q.parentId||'';
  if(!parentId&&await syncMsgIds(ownerId))parentId=(messages[i-1]||{}).parentId||'';
  if(!parentId){showError('这一轮缺少定位信息，请刷新会话后重试。问题已填入输入框，可直接再发一次。');
    draftBox.value=q.content;draftBox.focus();return}
  let rewound=false;
  {
    try{
      const r=await fetch('/api/chat/rewind?sessionId='+encodeURIComponent(ownerId)+'&nodeId='+encodeURIComponent(parentId),{method:'POST'});
      if(!r.ok){const j=await r.json().catch(()=>({}));throw new Error(j.error||('HTTP '+r.status))}
      rewound=true;
    }catch(e){
      showError('回退失败：'+e.message+'。问题已填入输入框，可继续提问。');
    }
  }
  if(rewound&&currentId===ownerId){
    try{
      const r=await fetch('/api/chat/history?sessionId='+encodeURIComponent(ownerId));
      const list=await r.json();
      if(Array.isArray(list)&&currentId===ownerId){
        messages=list.map(m=>({role:m.role,content:m.content,sources:m.sources||[],streaming:false,
          nodeId:m.id||'',parentId:m.parentId||''}));
        msgStore[ownerId]=messages;
        cacheMessages(ownerId);
        renderMessages();scrollBottom(true);
      }
    }catch(e){}
  }
  draftBox.value=q.content;
  draftBox.focus();
  try{draftBox.setSelectionRange(draftBox.value.length,draftBox.value.length)}catch(e){}
  hideError();
  toast(rewound?'已回到这一轮，改完按 Enter 发送（原分支保留在会话结构里）':'问题已填入输入框','ok');
}
function patchCites(card,m,i){
  const zone=card.querySelector('.cite-zone');if(!zone)return;
  const src=m.sources||[];
  // 同一文档的多个片段合并成一个引用角标，避免文件名重复刷屏
  const groups=new Map();
  src.forEach(s=>{
    const name=s.fileName||'(未知文档)';
    if(!groups.has(name))groups.set(name,[]);
    groups.get(name).push(s);
  });
  const gkey=src.length+'|'+groups.size+'|'+[...groups.keys()].join('~');
  if(zone.dataset.g===gkey)return;        // 分组没变化就不重绘，避免闪烁
  zone.dataset.g=gkey;
  const cnt=card.querySelector('.ai-cite-count');
  if(!src.length){zone.innerHTML='';if(cnt)cnt.style.display='none';return}
  if(cnt){cnt.style.display='';cnt.textContent='▤ '+groups.size+' 篇'}
  let num=0;
  const chips=[],previews=[];
  groups.forEach((segs,name)=>{
    const g=++num;
    chips.push('<span class="cite-chip" onclick="toggleCite('+i+','+g+')" title="展开该文档的 '+segs.length+' 个引用片段">'+
      '<span class="cite-num">'+g+'</span><span class="cite-file">'+escapeHtml(name)+'</span>'+
      (segs.length>1?'<span class="cite-multi">'+segs.length+'段</span>':'')+'</span>');
    const list=segs.map(s=>'<div class="cite-seg"><span class="cite-seg-no">第'+(Number(s.chunkIndex)+1)+'段</span>'+
      escapeHtml(s.preview||'')+'</div>').join('');
    previews.push('<div class="cite-preview" id="cite-p-'+i+'-'+g+'">'+list+'</div>');
  });
  zone.innerHTML='<div class="cite-row">'+chips.join('')+'</div>'+previews.join('');
}
// 流式增量：只更新最后一条 AI 卡片的正文与引用，【绝不重建整列】，因此不会闪。
function patchStreaming(){
  const box=document.getElementById('messages');
  const card=box.querySelector('.msg-group:last-child');

// 回答结束：只做收尾节点修改，不重建 DOM
function finalizeCard(){
  const box=document.getElementById('messages');

// force=true 强制到底（切换会话/新消息）；流式跟随只在用户已在底部时才滚，避免反复拽动
function scrollBottom(force){

}
function showError(msg){const el=document.getElementById('errorBar');el.textContent=msg;el.style.display='block'}
function hideError(){document.getElementById('errorBar').style.display='none'}
async function send(text){
  const q=(text||document.getElementById('question').value).trim();
  if(!q||sending)return;
  const ownerId=currentId;              // 本次回答归属的会话，全程锁定，切换会话不影响它
  clearDraft(ownerId);
  sending=true;document.getElementById('sendBtn').disabled=true;hideError();
  // 首问自动把问题当标题：读—改—写一次完成，别先改内存再写回（会丢标题）
  touchSession(ownerId, q.length>18?q.slice(0,18)+'…':q);renderSessions();
  const store=storeOf(ownerId);         // 写入归属会话自己的数组，不是全局变量
  store.push({role:'user',content:q,sources:[],streaming:false});
  const ai={role:'assistant',content:'',sources:[],streaming:true};
  store.push(ai);
  if(currentId===ownerId){renderMessages();scrollBottom(true)}
  let finished=false;                 // 是否已收到后端 done 事件
  try{
    const r=await fetch('/api/chat/stream',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({sessionId:ownerId,question:q})
    });
    if(!r.ok)throw new Error('请求失败（HTTP '+r.status+'）');
    const reader=r.body.getReader(),dec=new TextDecoder();let buf='';
    while(true){
      const {done,value}=await reader.read();if(done)break;
      buf=(buf+dec.decode(value,{stream:true})).replace(/\r\n/g,'\n');
      let p;
      while((p=buf.indexOf('\n\n'))!==-1){
        const block=buf.slice(0,p);buf=buf.slice(p+2);
        let ev='message';const dataLines=[];
        block.split('\n').forEach(line=>{
          if(line.startsWith('event:'))ev=line.slice(6).trim();
          else if(line.startsWith('data:'))dataLines.push(line.slice(5).trim());
        });
        const data=dataLines.join('\n');
        if(ev==='sources'){try{ai.sources=JSON.parse(data)}catch(e){}}
        else if(ev==='message')ai.content+=data;
        else if(ev==='done'){
          finished=true;
          // done 载荷是 JSON（含本次消耗）；兼容旧格式 [DONE]，解析失败按无用量处理
          if(data&&data.charAt(0)==='{'){
            try{
              const d=JSON.parse(data);
              if(d&&d.usage)ai.usage=Object.assign({durationMs:d.durationMs||0},d.usage);
              // 本轮两个节点的 id 由 done 一并带回：不接住的话，刚问完的这一轮
              // 在页面上没有 parentId，「从这里再问」会以为没有上一轮。
              if(d&&d.nodes&&store.length>=2){
                const qn=store[store.length-2],an=store[store.length-1];
                qn.nodeId=d.nodes.questionId||qn.nodeId;
                qn.parentId=d.nodes.parentId||qn.parentId||'';
                an.nodeId=d.nodes.answerId||an.nodeId;
                an.parentId=d.nodes.questionId||an.parentId||'';
              }
            }catch(e){}
          }
        }
      }
      // 流式增量：只 patch 最后一条卡片正文，绝不重建整列 DOM（消除闪烁）
      // 切走后不再触碰 DOM，避免把别的会话内容搅乱
      if(currentId===ownerId){patchStreaming();scrollBottom()}
      // 收到 done 就主动收尾：不再继续 read()，避免等服务端关闭 TCP 时
      // 某些网络环境下 fetch 抛出 "network error" 把正常回答标成失败
      if(finished)break;
    }
  }catch(e){
    // 浏览器 fetch 底层断网时 e.message 就是英文 "network error"。
    // 已收到 done 或已有正文都视为成功收尾，绝不再弹刺眼的红色错误条。
    const networkLike=/network|fetch|failed|abort|terminated/i.test(e.message||'');
    if(finished){
      // 正常完成，无需提示
    }else if(ai.content){
      if(currentId===ownerId)toast('连接中断，已保留收到的回答','err');
    }else{
      ai.content='（回答生成失败，请稍后重试）';
      showError(networkLike?'连接中断，请检查网络后重试':'回答生成失败，请稍后重试');
    }
  }finally{
    ai.streaming=false;sending=false;
    document.getElementById('sendBtn').disabled=false;
    cacheMessages(ownerId,store);       // 落到归属会话的缓存
    if(currentId===ownerId){patchStreaming();finalizeCard();scrollBottom(true)}
    else toast('后台回答已完成','ok');   // 切走了给个轻提示，不打断当前视图
  }
}
function quickAsk(q){document.getElementById('question').value=q;send()}
const draftBox=document.getElementById('question');
// 草稿按会话隔离：切到哪个会话就显示哪个会话的草稿，绝不串台。
function syncDraft(){
  try{draftBox.value=sessionStorage.getItem(draftKey(currentId))||''}catch(e){draftBox.value=''}
}
function clearDraft(id){
  try{sessionStorage.removeItem(draftKey(id||currentId))}catch(e){}
  if((id||currentId)===currentId)draftBox.value='';
}
draftBox.addEventListener('input',()=>{
  try{sessionStorage.setItem(draftKey(currentId),draftBox.value)}catch(e){}
});
draftBox.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();send()}
});
async function clearHistory(){
  try{
    await fetch('/api/chat/history?sessionId='+encodeURIComponent(currentId),{method:'DELETE'});
    const id=currentId;
    try{localStorage.removeItem(cacheKey(id))}catch(e){}
    msgStore[id]=[];messages=[];renderMessages();hideError();toast('当前会话历史已清空','ok');
  }catch(e){showError(e.message)}
}
async function testTool(){
  try{
    const r=await fetch('/api/chat/tool/water?station='+encodeURIComponent('云溪水库'),{method:'POST'});
    document.getElementById('question').value='工具直调结果：'+await r.text();
  }catch(e){showError(e.message)}
}
// 侧栏由公共组件 app.js 统一渲染；这里注册会话切换钩子，把侧栏点击接回问答逻辑
// 第二个参数是动作类型：切换会话不传，'__delete__' 表示侧栏刚删掉了一个会话
Shell.onSessionChange(function(id,action){
  if(action==='__delete__'){onSessionDeleted(id);return}
  if(id==='__new__')newSession();
  else switchSession(id);
});
// 侧栏删除会话后必须同步这里的状态：会话列表以 localStorage 为准，这里重新读一次即可；
// 同时清掉内存里的消息与本地缓存，否则下次打开还会从缓存把内容渲染出来。
// 之前不做这步、又用内存副本整体写回，于是被删的会话在下次发消息时"自己回来"。
function onSessionDeleted(id){
  sessions=Shell.getSessions();
  delete msgStore[id];
  try{localStorage.removeItem(cacheKey(id))}catch(e){}
  if(currentId===id){
    currentId='';                       // 先断开，避免 switchSession 把已删会话的缓存写回去
    if(sessions.length)switchSession(sessions[0].id);
    else newSession();
  }else renderSessions();
}
initShell('index');       // 渲染全站统一侧栏 + 服务探活 + 触发一次会话清单同步
// 先等清单（最多 1.5 秒），再初始化会话；网络慢就直接用本地缓存往下走
(async function boot(){
  try{
    await Promise.race([Shell.syncSessions(),new Promise(r=>setTimeout(r,1500))]);
  }catch(e){}
  booting=false;
  loadSessions();
  if(!currentId)newSession();
  Shell.setSession(currentId);
})();
Shell.refreshDocs();      // 侧栏文档清单（公共组件）
</script>
