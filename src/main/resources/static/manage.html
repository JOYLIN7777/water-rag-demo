<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>知识库文档管理</title>
<style>
  :root{--primary:#2563eb;--primary-dark:#1d4ed8;--border:#e5e7eb;--muted:#6b7280;--bg:#f9fafb}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:#1f2937;background:var(--bg)}
  button{font-family:inherit;cursor:pointer}
  .topbar{height:58px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 24px}
  .topbar .left{display:flex;align-items:center;gap:12px}
  .brand-mark{width:34px;height:34px;border-radius:9px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:600}
  .topbar-title{font-size:15px;font-weight:600;color:#111827}
  .text-btn{border:1px solid var(--border);background:#fff;color:#4b5563;padding:6px 12px;border-radius:7px;font-size:12px;text-decoration:none;display:inline-block}
  .text-btn:hover{border-color:#93c5fd;color:var(--primary);background:#f8fbff}
  .page{max-width:980px;margin:24px auto;padding:0 20px}
  .stats{display:flex;gap:14px;margin-bottom:18px}
  .stat-card{flex:1;background:#fff;border:1px solid var(--border);border-radius:12px;padding:16px 18px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
  .stat-num{font-size:24px;font-weight:600;color:var(--primary)}
  .stat-label{font-size:12px;color:var(--muted);margin-top:4px}
  .toolbar{display:flex;gap:10px;margin-bottom:14px;align-items:center}
  .search{flex:1;max-width:340px;padding:9px 12px;border:1px solid var(--border);border-radius:8px;font-size:13px;outline:0;font-family:inherit}
  .search:focus{border-color:#93c5fd;box-shadow:0 0 0 3px #dbeafe}
  .dropzone{border:1.5px dashed #cbd5e1;border-radius:10px;padding:14px 10px;text-align:center;cursor:pointer;transition:all .2s;background:#fff}
  .dropzone:hover,.dropzone.dragging{border-color:var(--primary);background:#eff6ff}
  .dropzone .t{font-size:12.5px;color:#4b5563}
  .upload-msg{margin:10px 0;padding:8px 12px;border-radius:7px;font-size:12.5px;line-height:1.5;word-break:break-all;display:none}
  .upload-msg.ok{background:#ecfdf5;color:#047857;border:1px solid #a7f3d0}
  .upload-msg.err{background:#fef2f2;color:#b91c1c;border:1px solid #fecaca}
  .table-card{background:#fff;border:1px solid var(--border);border-radius:12px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.04)}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th{background:#f8fafc;color:#6b7280;font-weight:500;text-align:left;padding:11px 16px;border-bottom:1px solid var(--border);font-size:12px}
  td{padding:12px 16px;border-bottom:1px solid #f3f4f6}
  tr:last-child td{border-bottom:0}
  tr:hover td{background:#f8fafc}
  .doc-name{max-width:420px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .del-btn{border:1px solid #fecaca;background:#fff;color:#dc2626;padding:5px 12px;border-radius:6px;font-size:12px}
  .del-btn:hover{background:#fef2f2}
  .empty{padding:40px;text-align:center;color:#9ca3af;font-size:13px}
  .foot-tip{font-size:11px;color:#9ca3af;text-align:center;margin:18px 0}
  ::-webkit-scrollbar{width:8px}::-webkit-scrollbar-thumb{background:#d1d5db;border-radius:4px}
</style>
</head>
<body>
<header class="topbar">
  <div class="left">
    <div class="brand-mark">水</div>
    <div class="topbar-title">知识库文档管理</div>
  </div>
  <a class="text-btn" href="index.html">← 返回问答</a>
</header>

<div class="page">
  <div class="stats">
    <div class="stat-card"><div class="stat-num" id="statDocs">-</div><div class="stat-label">已入库文档数</div></div>
    <div class="stat-card"><div class="stat-num" id="statChunks">-</div><div class="stat-label">切片总数（向量条数）</div></div>
    <div class="stat-card"><div class="stat-num" id="statLatest">-</div><div class="stat-label">最近更新时间</div></div>
  </div>

  <div class="toolbar">
    <input class="search" id="search" placeholder="按文件名过滤…">
    <div class="dropzone" id="dropzone" style="flex:1">
      <span class="t">⇪ 点击或拖拽上传文档入库</span>
    </div>
    <input type="file" id="fileInput" hidden>
  </div>

  <div class="upload-msg" id="uploadMsg"></div>

  <div class="table-card">
    <table>
      <thead><tr><th style="width:55%">文件名</th><th>切片数</th><th>最近上传时间</th><th style="width:110px">操作</th></tr></thead>
      <tbody id="docTbody"><tr><td colspan="4" class="empty">加载中…</td></tr></tbody>
    </table>
  </div>
  <div class="foot-tip">删除文档会同时移除其全部向量切片，删除前请确认不再需要问答引用该文档。</div>
</div>

<script>
let docs=[];
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
// 后端时间是带纳秒的 ISO 字符串，JS Date 解析不了，截到毫秒
function fmtTime(s){
  if(!s)return '-';
  const d=new Date(String(s).replace(/(\.\d{3})\d+/,'$1'));
  return isNaN(d)?s:d.toLocaleString('zh-CN',{hour12:false});
}

async function loadDocs(){
  const tbody=document.getElementById('docTbody');
  try{
    docs=await (await fetch('/api/docs/list')).json();
    render();
    document.getElementById('statDocs').textContent=docs.length;
    document.getElementById('statChunks').textContent=docs.reduce((a,d)=>a+Number(d.chunks),0);
    const latest=docs.map(d=>d.uploadedAt||'').sort().pop();
    document.getElementById('statLatest').textContent=latest?fmtTime(latest):'-';
  }catch(e){tbody.innerHTML='<tr><td colspan="4" class="empty">加载失败：'+escapeHtml(e.message)+'</td></tr>'}
}

function render(){
  const kw=document.getElementById('search').value.trim().toLowerCase();
  const list=docs.filter(d=>!kw||d.fileName.toLowerCase().includes(kw));
  const tbody=document.getElementById('docTbody');
  if(!list.length){tbody.innerHTML='<tr><td colspan="4" class="empty">'+(kw?'无匹配文档':'知识库暂无文档，先上传一份吧')+'</td></tr>';return}
  tbody.innerHTML='';
  list.forEach(d=>{
    const tr=document.createElement('tr');
    tr.innerHTML='<td class="doc-name" title="'+escapeHtml(d.fileName)+'">'+escapeHtml(d.fileName)+'</td>'+
      '<td>'+d.chunks+'</td><td>'+fmtTime(d.uploadedAt)+'</td>'+
      '<td><button class="del-btn">删除</button></td>';
    tr.querySelector('.del-btn').onclick=()=>delDoc(d);
    tbody.appendChild(tr);
  });
}
document.getElementById('search').addEventListener('input',render);

async function delDoc(d){
  if(!confirm('确定从知识库删除「'+d.fileName+'」（'+d.chunks+' 个切片）吗？\n删除后相关内容将无法再被问答引用。'))return;
  showMsg('','正在删除 '+d.fileName+' ...');
  try{
    const r=await fetch('/api/docs?fileName='+encodeURIComponent(d.fileName),{method:'DELETE'});
    const j=await r.json();
    if(!r.ok||j.deletedChunks===undefined)throw new Error(j.message||('删除失败（HTTP '+r.status+'）'));
    showMsg('ok','✓ 已删除「'+d.fileName+'」（'+j.deletedChunks+' 个切片）');
    loadDocs();
  }catch(e){showMsg('err','✗ 删除失败：'+e.message)}
}

async function uploadFile(file){
  if(!file)return;
  showMsg('','正在解析 '+file.name+' ...');
  const fd=new FormData();fd.append('file',file);
  const started=Date.now();
  try{
    const r=await fetch('/api/docs/upload',{method:'POST',body:fd});
    const j=await r.json();
    if(!r.ok||j.chunks===undefined)throw new Error(j.message||('上传失败（HTTP '+r.status+'）'));
    const secs=((Date.now()-started)/1000).toFixed(1);
    showMsg('ok','✓ 解析完成：'+file.name+' 共 '+j.chunks+' 个切片（'+j.chars+' 字），耗时 '+secs+' 秒');
    loadDocs();
  }catch(e){showMsg('err','✗ '+file.name+' 入库失败：'+e.message)}
}
function showMsg(type,text){
  const el=document.getElementById('uploadMsg');
  el.className='upload-msg'+(type?' '+type:'');el.style.display='block';el.textContent=text;
}

const dz=document.getElementById('dropzone');
dz.onclick=()=>document.getElementById('fileInput').click();
dz.ondragover=e=>{e.preventDefault();dz.classList.add('dragging')};
dz.ondragleave=e=>{e.preventDefault();dz.classList.remove('dragging')};
dz.ondrop=e=>{e.preventDefault();dz.classList.remove('dragging');uploadFile(e.dataTransfer.files[0])};
document.getElementById('fileInput').onchange=e=>{uploadFile(e.target.files[0]);e.target.value=''};

loadDocs();
</script>
</body>
</html>
