<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>个人中心 · 水利知识库</title>
<link rel="stylesheet" href="assets/app.css">
<style>
  .profile-head{display:flex;align-items:center;gap:18px;padding:4px 2px 22px}
  .profile-avatar{width:68px;height:68px;border-radius:18px;flex:0 0 68px;background:linear-gradient(135deg,var(--primary-hi),var(--primary));color:#fff;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:700;box-shadow:0 8px 22px rgba(59,110,245,.3)}
  .profile-name{font-size:20px;font-weight:680;color:var(--ink)}
  .profile-sub{font-size:12.5px;color:var(--muted);margin-top:5px}
  .info-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
  .info-cell{background:#f8fafc;border:1px solid var(--line);border-radius:9px;padding:12px 14px}
  .info-cell .k{font-size:10.5px;color:var(--muted);margin-bottom:5px}
  .info-cell .v{font-size:13.5px;color:var(--ink);font-weight:600;word-break:break-all}
  .token-bar{height:6px;border-radius:3px;background:#eef2f8;overflow:hidden;margin-top:8px}
  .token-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ok),#5bd0a4);border-radius:3px;transition:width .3s}
  .pw-form{max-width:440px}
  .pw-form .field{margin-bottom:15px}
  .err{min-height:20px;font-size:12px;color:var(--danger);margin-top:4px}
  .ok{min-height:20px;font-size:12px;color:var(--ok);margin-top:4px}
</style>
</head>
<body>
<div class="layout" id="sidebarHost">
<main class="main">
  <header class="topbar">
    <div class="topbar-left"><div class="topbar-title">个人中心</div><span class="topbar-sub">账号 / 安全 / 令牌</span></div>
    <span class="status-pill" data-status-pill><span class="status-dot"></span>检测中…</span>
  </header>

  <div class="page">
    <div class="page-head">
      <h1 class="page-title">个人中心</h1>
      <p class="page-desc">查看当前登录账号信息、访问令牌状态，并修改登录密码。</p>
    </div>

    <div class="profile-head">
      <div class="profile-avatar" id="pAvatar">演</div>
      <div><div class="profile-name" id="pName">加载中…</div>
        <div class="profile-sub" id="pSub">—</div></div>
    </div>

    <div class="card">
      <div class="card-head"><h3>账号信息</h3></div>
      <div class="info-grid" id="pInfo">加载中…</div>
    </div>

    <div class="card">
      <div class="card-head"><h3>访问令牌</h3><button class="btn btn-sm" onclick="WrkAuth.logout()">退出登录</button></div>
      <div class="sub">采用 access + refresh 双令牌：access 用于访问 API，过期后由 refresh 自动续期；登出会立即使 access 失效。</div>
      <div class="info-grid" id="pToken">加载中…</div>
    </div>

    <div class="card">
      <div class="card-head"><h3>修改密码</h3></div>
      <div class="sub">修改后当前令牌仍有效至过期，下次登录需使用新密码。密码以 PBKDF2 加盐哈希存储，服务端不保留明文。</div>
      <form class="pw-form" id="pwForm">
        <div class="field"><label for="oldPwd">当前密码</label>
          <input id="oldPwd" type="password" autocomplete="current-password" placeholder="请输入当前密码"></div>
        <div class="field"><label for="newPwd">新密码</label>
          <input id="newPwd" type="password" autocomplete="new-password" placeholder="至少 8 位"></div>
        <div class="field"><label for="newPwd2">确认新密码</label>
          <input id="newPwd2" type="password" autocomplete="new-password" placeholder="再次输入新密码"></div>
        <div id="pwMsg"></div>
        <button class="btn btn-primary" type="submit" id="pwBtn">确认修改</button>
      </form>
    </div>
  </div>
</main>
</div>

<script src="assets/auth.js"></script>
<script src="assets/app.js"></script>
<script>
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const tag=(t,c)=>'<span class="tag '+c+'">'+esc(t)+'</span>';

// 从 JWT payload 解析 exp（仅用于展示，服务端仍会独立验签）
function parseJwt(tok){try{return JSON.parse(atob(tok.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')))}catch(e){return null}}

async function loadProfile(){
  try{
    const r=await fetch('/api/auth/me');
    if(r.status===401){WrkAuth.goLogin();return}
    const j=await r.json();
    const name=j.user;
    document.getElementById('pName').textContent=name;
    document.getElementById('pAvatar').textContent=(name||'演').slice(0,1).toUpperCase();
    document.getElementById('pSub').textContent='租户 '+j.tenant+' · '+((j.groups||[]).join('、')||'无用户组');
    document.getElementById('pInfo').innerHTML=
      '<div class="info-cell"><div class="k">用户名</div><div class="v">'+esc(j.user)+'</div></div>'+
      '<div class="info-cell"><div class="k">用户组 / 角色</div><div class="v">'+(j.groups&&j.groups.length?j.groups.map(esc).join('、'):'—')+'</div></div>'+
      '<div class="info-cell"><div class="k">所属租户</div><div class="v">'+esc(j.tenant)+'</div></div>'+
      '<div class="info-cell"><div class="k">认证方式</div><div class="v">'+tag(j.authType==='jwt'?'JWT 令牌':j.authType,'info')+'</div></div>';

    // 令牌有效期：从本地 access token 解析 exp，展示剩余时间与进度条
    const tok=WrkAuth.getAccess();const c=tok?parseJwt(tok):null;
    if(c&&c.exp){
      const remain=Math.max(0,c.exp-Math.floor(Date.now()/1000));
      const iat=c.iat||(c.exp-remain),total=Math.max(1,c.exp-iat),pct=Math.min(100,Math.round(remain/total*100));
      const mm=Math.floor(remain/60),ss=remain%60;
      document.getElementById('pToken').innerHTML=
        '<div class="info-cell" style="grid-column:1/-1"><div class="k">access 令牌剩余有效期</div>'+
        '<div class="v">'+mm+' 分 '+String(ss).padStart(2,'0')+' 秒</div>'+
        '<div class="token-bar"><i style="width:'+pct+'%"></i></div>'+
        '<div class="k" style="margin-top:8px">过期后前端自动用 refresh 令牌续期，无需重新登录</div></div>';
    }else{
      document.getElementById('pToken').innerHTML='<div class="info-cell" style="grid-column:1/-1"><div class="v">未获取到令牌信息</div></div>';
    }
  }catch(e){document.getElementById('pInfo').innerHTML='<div class="empty">加载失败</div>'}
}

document.getElementById('pwForm').addEventListener('submit',async function(e){
  e.preventDefault();
  const msg=document.getElementById('pwMsg'),btn=document.getElementById('pwBtn');
  const oldPwd=document.getElementById('oldPwd').value;
  const newPwd=document.getElementById('newPwd').value;
  const newPwd2=document.getElementById('newPwd2').value;
  msg.className='';msg.textContent='';
  if(newPwd!==newPwd2){msg.className='err';msg.textContent='两次输入的新密码不一致';return}
  if(newPwd.length<8){msg.className='err';msg.textContent='新密码长度至少 8 位';return}
  btn.disabled=true;btn.textContent='提交中…';
  try{
    const r=await fetch('/api/auth/change-password',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({oldPassword:oldPwd,newPassword:newPwd})
    });
    const j=await r.json();
    if(!r.ok){msg.className='err';msg.textContent=j.message||('修改失败（HTTP '+r.status+'）');return}
    msg.className='ok';msg.textContent='✓ '+j.message;
    document.getElementById('pwForm').reset();
    appToast('密码已修改','ok');
  }catch(err){msg.className='err';msg.textContent='网络异常：'+err.message}
  finally{btn.disabled=false;btn.textContent='确认修改'}
});

initShell('profile');
loadProfile();
</script>
</body>
</html>
