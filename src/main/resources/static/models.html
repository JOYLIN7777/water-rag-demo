<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>模型配置 · 水利知识库</title>
<link rel="stylesheet" href="assets/app.css">
<style>
  .row{display:flex;gap:12px;flex-wrap:wrap}
  .row .field{flex:1;min-width:150px}
  #activeBox .active-item{margin-bottom:16px}
  #activeBox .active-label{font-size:11.5px;color:var(--muted);margin-bottom:4px}
  #activeBox .active-name{font-size:15px;font-weight:650;color:var(--ink)}
  #activeBox .active-divider{border-top:1px solid var(--line);margin:16px 0}
</style>
</head>
<body>
<div class="layout" id="sidebarHost">
<main class="main">
  <header class="topbar">
    <div class="topbar-left"><div class="topbar-title">模型配置</div><span class="topbar-sub">/ 模型</span></div>
    <span class="status-pill" data-status-pill><span class="status-dot"></span><span id="adminEntrySlot" class="admin-slot"></span>检测中…</span>
  </header>

  <div class="page">
    <div class="page-head">
      <h1 class="page-title">模型设置</h1>
      <p class="page-desc">设置对话模型和文档检索模型，支持公有云服务与内网私有部署。</p>
    </div>

    <div class="intro">
      对话模型切换后立即生效；文档检索模型切换前会校验向量维度，与已入库数据不一致时会阻止切换，避免影响现有知识库。
      密钥只显示前 4 后 4 位，更新时不填写即保持原值。
    </div>

    <div class="grid">
      <div class="card">
        <div class="card-head"><h3>新增模型配置</h3></div>
        <div class="row">
          <div class="field" style="flex:2"><label>名称</label><input id="fName" type="text" placeholder="如：内网-Qwen3.5-397B"></div>
          <div class="field"><label>类型</label><select id="fType"><option value="CHAT">CHAT 对话</option><option value="EMBEDDING">EMBEDDING 向量</option></select></div>
        </div>
        <div class="field"><label>服务地址</label><input id="fUrl" type="text" placeholder="云服务地址或内网模型地址"></div>
        <div class="row">
          <div class="field"><label>模型名</label><input id="fModel" type="text" placeholder="qwen-plus / text-embedding-v3"></div>
          <div class="field"><label>访问密钥（内网可留空）</label><input id="fKey" type="password" placeholder="留空表示保持原值"></div>
        </div>
        <div class="field" id="dimField" style="display:none"><label>向量维度（EMBEDDING 必填）</label><input id="fDim" type="number" placeholder="1024"></div>
        <button class="primary-btn" onclick="createModel()">＋ 添加配置</button>
        <div class="msg" id="createMsg"></div>
        <div class="hint">提示：切换文档检索模型前，建议先点「测试」确认服务可用；不同维度的模型不能共用同一个知识库。</div>
      </div>
      <div class="card">
        <div class="card-head"><h3>当前生效配置</h3></div>
        <div id="activeBox"><div class="empty">加载中…</div></div>
        <div class="msg" id="activeMsg"></div>
      </div>
    </div>

    <div class="table-card">
      <div class="scroll"><table>
        <thead><tr><th>名称 / 类型</th><th>端点 / 模型</th><th>Key</th><th>状态</th><th style="width:190px">操作</th></tr></thead>
        <tbody id="tbody"><tr><td colspan="5" class="empty">加载中…</td></tr></tbody>
      </table></div>
    </div>
  </div>
</main>
</div>

<script src="assets/auth.js"></script>
<script src="assets/app.js"></script>
<script>
let models=[];
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function show(id,text,ok){const el=document.getElementById(id);el.className='msg '+(ok?'ok':'err');el.textContent=text}
async function loadModels(){
  try{
    models=await (await fetch('/api/models')).json();
    const tb=document.getElementById('tbody');
    if(!models.length){tb.innerHTML='<tr><td colspan="5" class="empty">暂无配置</td></tr>';renderActive();return}
    tb.innerHTML='';
    models.forEach(m=>{
      const tr=document.createElement('tr');
      tr.innerHTML='<td><span class="name">'+esc(m.name)+'</span><br><span class="tag '+(m.type==='EMBEDDING'?'emb':'')+'">'+esc(m.type)+'</span>'+
        (m.dimensions?' <span class="tag">'+m.dimensions+'维</span>':'')+'</td>'+
        '<td><span class="mono">'+esc(m.baseUrl)+'</span><span class="mono">'+esc(m.model)+'</span></td>'+
        '<td><span class="mono">'+esc(m.apiKey)+'</span></td>'+
        '<td><span class="tag '+(m.active?'active':'off')+'">'+(m.active?'使用中':(m.enabled?'待命':'已禁用'))+'</span></td>'+
        '<td><div style="display:flex;gap:6px;flex-wrap:wrap">'+
          (m.active?'<button class="btn btn-sm" disabled>已激活</button>':'<button class="btn btn-sm" onclick="activate('+m.id+')">激活</button>')+
          '<button class="btn btn-sm" onclick="testModel('+m.id+',this)">测试</button>'+
          '<button class="btn btn-sm btn-danger" onclick="delModel('+m.id+')"'+(m.active?' disabled':'')+'>删除</button>'+
        '</div></td>';
      tb.appendChild(tr);
    });
    renderActive();
  }catch(e){document.getElementById('tbody').innerHTML='<tr><td colspan="5" class="empty">加载失败：'+esc(e.message)+'</td></tr>'}
}
function renderActive(){
  const box=document.getElementById('activeBox');
  const chat=models.find(m=>m.type==='CHAT'&&m.active),emb=models.find(m=>m.type==='EMBEDDING'&&m.active);
  box.innerHTML='<div class="active-item"><div class="active-label">对话模型（CHAT）</div>'+
    '<div class="active-name">'+esc(chat?chat.name:'未配置')+'</div>'+
    '<span class="mono">'+(chat?esc(chat.model):'—')+'</span></div>'+
    '<div class="active-divider"></div>'+
    '<div><div class="active-label">向量模型（EMBEDDING）</div>'+
    '<div class="active-name">'+esc(emb?emb.name:'未配置')+'</div>'+
    '<span class="mono">'+(emb?esc(emb.model+' · '+emb.dimensions+'维'):'—')+'</span></div>';
}
document.getElementById('fType').onchange=e=>{
  document.getElementById('dimField').style.display=e.target.value==='EMBEDDING'?'block':'none';
};
async function createModel(){
  const type=document.getElementById('fType').value;
  const body={name:document.getElementById('fName').value.trim(),type:type,
    baseUrl:document.getElementById('fUrl').value.trim(),model:document.getElementById('fModel').value.trim(),
    apiKey:document.getElementById('fKey').value.trim(),dimensions:type==='EMBEDDING'?Number(document.getElementById('fDim').value):null,
    enabled:true,active:false};
  try{
    const r=await fetch('/api/models',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    const j=await r.json();if(!r.ok)throw new Error(j.message||('HTTP '+r.status));
    show('createMsg','✓ '+j.message,true);
    ['fName','fUrl','fModel','fKey','fDim'].forEach(id=>document.getElementById(id).value='');
    appToast('配置已添加','ok');
    loadModels();
  }catch(e){show('createMsg','✗ '+e.message,false)}
}
async function activate(id){
  try{
    const r=await fetch('/api/models/'+id+'/activate',{method:'POST'});
    const j=await r.json();if(!r.ok)throw new Error(j.message||('HTTP '+r.status));
    show('activeMsg','✓ '+j.message+'（已即时生效，无需重启）',true);
    appToast('模型已切换','ok');
    loadModels();
  }catch(e){show('activeMsg','✗ '+e.message,false)}
}
async function testModel(id,btn){
  btn.disabled=true;btn.textContent='测试中…';
  try{
    const r=await fetch('/api/models/'+id+'/test',{method:'POST'});
    const j=await r.json();if(!r.ok)throw new Error(j.message||('HTTP '+r.status));
    const ok=j.result.startsWith('OK');
    show('activeMsg',(ok?'✓ ':'✗ ')+j.name+'：'+j.result,ok);
  }catch(e){show('activeMsg','✗ '+e.message,false)}
  finally{btn.disabled=false;btn.textContent='测试'}
}
async function delModel(id){
  const m=models.find(x=>x.id===id);
  if(!confirm('确定删除模型配置「'+(m?m.name:id)+'」吗？'))return;
  try{
    const r=await fetch('/api/models/'+id,{method:'DELETE'});
    const j=await r.json();if(!r.ok)throw new Error(j.message||('HTTP '+r.status));
    appToast('配置已删除','ok');
    loadModels();
  }catch(e){show('activeMsg','✗ '+e.message,false)}
}
initShell('settings');
loadModels();
</script>
</body>
</html>
