<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>企业治理中心 · 水利知识库</title>
<link rel="icon" type="image/svg+xml" href="assets/logo.svg">
<link rel="stylesheet" href="assets/app.css">
<style>
  .perm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
  .perm-item{display:flex;align-items:center;gap:9px;border:1px solid var(--line);border-radius:9px;padding:10px 12px;background:#fff}
  .perm-item .pi{width:26px;height:26px;border-radius:7px;background:var(--primary-soft);color:var(--primary);display:flex;align-items:center;justify-content:center;font-size:13px;flex:0 0 26px}
  .perm-item .pn{flex:1;font-size:12.5px;color:var(--ink);font-weight:600}
  .identity-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
  .id-cell{background:#f8fafc;border:1px solid var(--line);border-radius:9px;padding:12px 14px}
  .id-cell .k{font-size:10.5px;color:var(--muted);margin-bottom:5px}
  .id-cell .v{font-size:14px;color:var(--ink);font-weight:650;word-break:break-all}
  .layer{border-left:3px solid var(--primary);padding-left:14px;margin:18px 0 10px;font-size:12.5px;color:var(--ink);font-weight:650}
  .layer:first-child{margin-top:4px}
  .data-scope{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
  .data-scope span{background:#f1f5fb;border-radius:7px;padding:5px 10px;font-size:11.5px;color:var(--ink-2)}
  .tool-line{display:flex;align-items:flex-start;gap:10px;padding:11px 0;border-bottom:1px solid #f1f4f9;font-size:12.5px}
  .tool-line:last-child{border-bottom:0}
  .tool-line .tn{font-weight:650;color:var(--ink)}
  .tool-line .td{font-size:11px;color:var(--muted);margin-top:4px}
  .tool-line .tr{margin-left:auto;flex:0 0 auto}
  td.detail{max-width:340px;white-space:normal;word-break:break-all;color:var(--muted)}
  .res-SUCCESS,.res-ALLOW{color:var(--ok);font-weight:600}
  .res-DENIED,.res-ERROR{color:var(--danger);font-weight:600}
  .notice{background:#fff8ec;border:1px solid #f5deb3;border-left:3px solid var(--warn);border-radius:9px;padding:11px 14px;font-size:11.5px;color:#8a5a12;line-height:1.7;margin-bottom:16px}
  .log-actions{display:inline-flex;gap:7px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
  .log-actions button.on{border-color:var(--primary);color:var(--primary);background:var(--primary-soft)}
  /* 操作记录分页：吸底显示，按钮放大并留足间距 */
  .pager{display:flex;gap:11px;align-items:center;justify-content:flex-end;margin-top:18px;padding:14px 2px 4px;
    border-top:1px solid var(--line);background:#fff;position:sticky;bottom:0;z-index:5;font-size:12.5px;color:var(--ink-2)}
  .pager button{border:1px solid var(--line);background:#fff;border-radius:7px;padding:7px 13px;min-width:34px;min-height:34px;
    cursor:pointer;color:var(--ink-2);font-size:12.5px;line-height:1.2}
  .pager button:hover:not(:disabled){border-color:var(--primary);color:var(--primary)}
  .pager button:disabled{opacity:.45;cursor:not-allowed}
  .pager .cur{background:var(--primary);border-color:var(--primary);color:#fff}
  .pager input{width:56px;padding:6px 8px;margin:0 5px;font-size:12.5px;border:1px solid var(--line);border-radius:7px;text-align:center}
</style>
</head>
<body>
<div class="layout" id="sidebarHost">
<main class="main">
  <header class="topbar">
    <div class="topbar-left"><div class="topbar-title">权限与日志</div><span class="topbar-sub">账号权限与操作记录</span></div>
    <span id="adminEntrySlot" class="admin-slot"></span>
  </header>

  <div class="page">
    <div class="page-head">
      <h1 class="page-title">权限与日志</h1>
      <p class="page-desc">查看当前账号可以访问的功能与数据范围，以及最近的操作记录。</p>
    </div>

    <div class="notice">这里显示的是你当前能使用的功能和可查看的数据范围。</div>

    <div class="card">
      <div class="card-head"><h3>① 当前登录身份</h3><a class="btn btn-sm" href="profile.html">个人中心</a></div>
      <div class="sub">你的账号信息</div>
      <div class="identity-grid" id="identity">加载中…</div>
    </div>

    <div class="card">
      <div class="card-head"><h3>② 我能使用的功能</h3>
        <button class="btn btn-sm" data-perm="audit:read" onclick="loadPermissions()">刷新</button></div>
      <div class="sub">标着「可用」的就是你当前能用的功能。</div>

      <div class="layer">可用功能</div>
      <div class="perm-grid" id="menuPerms">加载中…</div>

      <div class="layer">可查看的数据</div>
      <div id="dataPerms">加载中…</div>

      <div class="layer">可用工具</div>
      <div id="toolPerms">加载中…</div>
    </div>

    <div class="card" data-perm="audit:read">
      <div class="card-head"><h3>③ 操作记录</h3>
        <span class="log-actions">
          <button class="btn btn-sm" data-perm="loginlog:read" data-filter="login" onclick="setLogFilter('login')">登录日志</button>
          <button class="btn btn-sm" data-perm="audit:read" data-filter="operation" onclick="setLogFilter('operation')">操作日志</button>
          <button class="btn btn-sm" data-perm="audit:read" data-filter="all" onclick="setLogFilter('all')">全部</button>
          <button class="btn btn-sm" data-perm="loginlog:read" onclick="exportLogs('login')">导出登录日志</button>
          <button class="btn btn-sm btn-primary" data-perm="audit:read" onclick="exportLogs('operation')">导出操作日志</button>
          <button class="btn btn-sm" data-perm="audit:read" onclick="loadAudit()">刷新</button>
        </span></div>
      <div class="sub">最近的登录与操作情况，方便你核对是谁在什么时候做了什么。</div>
      <div class="kv" id="auditStats"></div>
      <div style="margin-top:14px">
        <table><thead><tr><th>时间</th><th>部门</th><th>账号</th><th>动作</th><th>状态</th><th>耗时</th><th>结果</th><th>详情</th></tr></thead><tbody id="auditBody"></tbody></table>
      </div>
      <div class="pager" id="auditPager" style="margin-top:10px"></div>
    </div>
  </div>
</main>
</div>

<script src="assets/auth.js"></script>
<script src="assets/app.js"></script>
<script>
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const tag=(txt,cls)=>'<span class="tag '+cls+'">'+esc(txt)+'</span>';

async function loadIdentity(){
  try{
    // 先取组织名字典：组织名存在服务端，管理员改名后这里要显示新名字而不是裸标识
    if(window.Shell&&Shell.loadOrgLabels)await Shell.loadOrgLabels();
    const r=await fetch('/api/auth/me');
    if(r.status===401){WrkAuth.goLogin();return}
    const j=await r.json();
    document.getElementById('identity').innerHTML=
      '<div class="id-cell"><div class="k">用户</div><div class="v">'+esc(j.user)+'</div></div>'+
      '<div class="id-cell"><div class="k">角色</div><div class="v">'+(j.groups&&j.groups.length?j.groups.map(g=>esc(window.Shell&&Shell.roleLabel?Shell.roleLabel(g):g)).join('、'):'—')+'</div></div>'+
      '<div class="id-cell"><div class="k">所属组织</div><div class="v">'+esc(window.Shell?Shell.tenantLabel(j.tenant):j.tenant)+'</div></div>'+
      '<div class="id-cell"><div class="k">登录方式</div><div class="v">'+tag('账号密码','info')+'</div></div>';
  }catch(e){document.getElementById('identity').innerHTML='<div class="empty">账号信息暂时加载不出来</div>'}
}

async function loadPermissions(){
  try{
    const r=await fetch('/api/auth/permissions');
    if(!r.ok)throw new Error('HTTP '+r.status);
    const p=await r.json();
    document.getElementById('menuPerms').innerHTML=(p.menus||[]).map(m=>
      '<div class="perm-item"><span class="pi">◈</span><span class="pn">'+esc(m.name)+'</span>'+
      (m.allowed?tag('可访问','ok'):tag('受限','no'))+'</div>').join('');
    const d=p.data||{};
    document.getElementById('dataPerms').innerHTML=
      '<div class="kv"><span>所属部门 <b>'+esc(window.Shell?Shell.tenantLabel(d.tenant):d.tenant)+'</b></span>'+
      '<span>可查看范围 <b>'+esc((d.rowLevelScopes||[]).join('、')||'本部门')+'</b></span></div>';
    document.getElementById('toolPerms').innerHTML=(p.tools||[]).length
      ? p.tools.map(t=>'<div class="tool-line"><div><div class="tn">'+esc(t.name||t.tool)+'</div>'+
          '<div class="td">'+esc(t.description||'')+'</div></div>'+
          '<div class="tr">'+(t.allowed?tag('可用','ok'):tag('不可用','no'))+'</div></div>').join('')
      : '<div class="empty">当前没有可使用的工具</div>';
  }catch(e){
    document.getElementById('menuPerms').innerHTML='<div class="empty">暂时没能加载，请点「刷新」重试</div>';
  }
}

let auditRows=[];
// 侧栏「登录日志 / 操作日志」落到本页不同锚点，默认按锚点筛选，避免两个入口内容一样
let logFilter = location.hash === '#loginlogs' ? 'login'
  : (location.hash === '#audit' ? 'operation' : 'all');
const AUDIT_PAGE={page:1,size:15};
function isLoginLog(l){return /\/api\/auth\/(login|logout|refresh)/.test(l.action||'')}
function setLogFilter(t){
  logFilter=t;
  history.replaceState(null,'',location.pathname+(t==='login'?'#loginlogs':t==='operation'?'#audit':''));
  document.querySelectorAll('.log-actions button[data-filter]').forEach(b=>
    b.classList.toggle('on',b.getAttribute('data-filter')===t));
  renderAuditPage(1);
}
async function exportLogs(type){
  try{
    const r=await fetch('/api/audit/logs/export?type='+type);
    if(!r.ok){if(window.appToast)appToast('导出失败，请稍后重试','err');return}
    const blob=await r.blob(), url=URL.createObjectURL(blob), a=document.createElement('a');
    a.href=url;
    a.download=(type==='login'?'登录日志':'操作日志')+'-'+new Date().toISOString().slice(0,10)+'.csv';
    a.click(); setTimeout(()=>URL.revokeObjectURL(url),2000);
  }catch(e){if(window.appToast)appToast('导出失败，请检查网络','err')}
}
function renderAuditPage(page){
  AUDIT_PAGE.page=page||AUDIT_PAGE.page;
  const list=logFilter==='all'?auditRows:auditRows.filter(l=>
    logFilter==='login'?isLoginLog(l):!isLoginLog(l));
  const totalPages=Math.max(1,Math.ceil(list.length/AUDIT_PAGE.size));
  if(AUDIT_PAGE.page>totalPages)AUDIT_PAGE.page=totalPages;
  const start=(AUDIT_PAGE.page-1)*AUDIT_PAGE.size;
  const slice=list.slice(start,start+AUDIT_PAGE.size);
  document.getElementById('auditBody').innerHTML=slice.map(l=>{
    const t=new Date(l.ts);
    const hh=isNaN(t.getTime())?String(l.ts||'').slice(11,19):
      [t.getHours(),t.getMinutes(),t.getSeconds()].map(n=>String(n).padStart(2,'0')).join(':');
    return '<tr><td>'+esc(hh)+'</td><td>'+esc(Shell.tenantLabel(l.tenant_id))+'</td><td>'+esc(l.user_id)+'</td>'+
    '<td>'+esc(l.action)+'</td><td>'+esc(l.status)+'</td><td>'+esc(l.duration_ms||0)+'ms</td>'+
    '<td class="res-'+esc(l.result)+'">'+esc(resultCn(l.result,l.status))+'</td><td class="detail">'+esc(l.detail)+'</td></tr>';
  }).join('')||'<tr><td colspan="8" class="empty">暂无记录</td></tr>';
  // 分页控件：上下页 + 页码 + 指定跳页
  const pager=document.getElementById('auditPager');
  const nums=[];
  for(let p=1;p<=totalPages;p++){
    if(p===1||p===totalPages||Math.abs(p-AUDIT_PAGE.page)<=1)nums.push(p);
    else if(nums[nums.length-1]!=='…')nums.push('…');
  }
  pager.style.display='flex';
  pager.innerHTML='<span>共 '+list.length+' 条 · 第 '+AUDIT_PAGE.page+'/'+totalPages+' 页</span>'+
    '<button '+(AUDIT_PAGE.page<=1?'disabled':'')+' data-go="1">«</button>'+
    '<button '+(AUDIT_PAGE.page<=1?'disabled':'')+' data-go="'+(AUDIT_PAGE.page-1)+'">‹</button>'+
    nums.map(p=>p==='…'?'<span style="padding:0 2px">…</span>':
      '<button class="'+(p===AUDIT_PAGE.page?'cur':'')+'" data-go="'+p+'">'+p+'</button>').join('')+
    '<button '+(AUDIT_PAGE.page>=totalPages?'disabled':'')+' data-go="'+(AUDIT_PAGE.page+1)+'">›</button>'+
    '<button '+(AUDIT_PAGE.page>=totalPages?'disabled':'')+' data-go="'+totalPages+'">»</button>'+
    '<span style="display:inline-flex;align-items:center;gap:4px;margin-left:8px">跳至 '+
    '<input type="number" min="1" max="'+totalPages+'" value="'+AUDIT_PAGE.page+'" id="auditPageJump">'+
    ' 页</span>';
  pager.querySelectorAll('button[data-go]').forEach(b=>{
    b.onclick=()=>{renderAuditPage(Number(b.dataset.go))};
  });
  const jump=document.getElementById('auditPageJump');
  if(jump)jump.onkeydown=e=>{
    if(e.key!=='Enter')return;
    let p=parseInt(jump.value,10);
    if(!p||p<1)p=1; if(p>totalPages)p=totalPages;
    renderAuditPage(p);
  };
}
async function loadAudit(){
  try{
    const s=await (await fetch('/api/audit/stats')).json();
    const scopeLabel=s.scope==='all'?'全部部门':(window.Shell?Shell.tenantLabel(s.tenant):s.tenant);
    document.getElementById('auditStats').innerHTML=
      '<span>共 <b>'+s.total+'</b> 条</span><span>未通过 <b style="color:var(--danger)">'+s.denied+'</b></span>'+
      '<span>异常 <b style="color:var(--danger)">'+s.errors+'</b></span><span>范围 <b>'+esc(scopeLabel)+'</b></span>';
    const j2=await (await fetch('/api/audit/logs?limit=500')).json();
    auditRows=j2.logs||[];
    document.querySelectorAll('.log-actions button[data-filter]').forEach(b=>
      b.classList.toggle('on',b.getAttribute('data-filter')===logFilter));
    renderAuditPage(1);
  }catch(e){document.getElementById('auditBody').innerHTML='<tr><td colspan="8" class="empty">记录加载失败</td></tr>'}
}
function resultCn(r,status){return r==='SUCCESS'?'成功':r==='DENIED'?'未通过':r==='ERROR'?'异常':(Number(status)>=400?'失败':r||'—')}
function exportAuditCsv(){
  if(!auditRows.length){if(window.appToast)appToast('暂无可导出的记录','info');return}
  const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  const head=['时间','部门','账号','动作','状态','耗时(ms)','结果','详情'];
  const rows=auditRows.map(l=>[l.ts,Shell.tenantLabel(l.tenant_id),l.user_id,l.action,l.status,l.duration_ms,resultCn(l.result,l.status),l.detail]);
  const csv='\ufeff'+[head].concat(rows).map(r=>r.map(q).join(',')).join('\r\n');
  const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  const a=document.createElement('a');a.href=url;a.download='操作记录-'+new Date().toISOString().slice(0,10)+'.csv';a.click();
  setTimeout(()=>URL.revokeObjectURL(url),2000);
}

initShell('governance',{adminSidebar:true});
loadIdentity();
loadPermissions();
loadAudit();
if(location.hash==='#audit')setTimeout(()=>{
  const cards=document.querySelectorAll('.page > .card');
  if(cards.length>2)cards[2].scrollIntoView({behavior:'smooth',block:'start'});
},400);
// 页面级权限守卫：菜单权限页没勾「权限与日志」的账号，直接敲 URL 也进不来
(async function guardPerm(){
  if(window.Shell&&Shell.permsReady)await Shell.permsReady();
  if(!(window.Shell&&Shell.hasPermission&&Shell.hasPermission('audit:read'))){
    const main=document.querySelector('main')||document.body;
    Array.from(main.children).forEach(el=>{if(!el.classList.contains('topbar'))el.style.display='none'});
    // 顶栏面包屑由公共组件注入在 topbar 内部，不属于 main 直属子元素——这里单独摘掉，
    // 并恢复原本的页面标题，避免无权限页残留导航（截图里的红框）
    const nav=main.querySelector('.topbar-nav-left');if(nav)nav.style.display='none';
    const ttl=main.querySelector('.topbar-title');if(ttl)ttl.style.display='';
    const sub=main.querySelector('.topbar-sub');if(sub)sub.style.display='';
    const bar=document.createElement('div');
    bar.className='card';bar.style.cssText='margin:auto;max-width:520px;padding:36px;text-align:center';
    bar.innerHTML='<div style="font-size:34px;margin-bottom:12px">🔒</div>'+
      '<div style="font-size:15px;font-weight:650;margin-bottom:8px">没有使用权限</div>'+
      '<div style="font-size:13px;color:#6b7a99;line-height:1.7">你暂时不能使用这个功能。<br>需要的话，请联系管理员开通。</div>'+
      '<a href="index.html" style="display:inline-block;margin-top:18px;color:var(--primary,#3b6ef5);text-decoration:none;font-size:13px">← 返回智能问答</a>';
    main.insertBefore(bar,main.firstChild);
  }
})();
</script>
</body>
</html>
