mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.joylin.waterkb.model
  configuration:
    map-underscore-to-camel-case: true

server:
  port: 8080
  tomcat:
    # 不限制超限请求的回吞量：文件超上限时能返回正常 JSON 报错，
    # 否则 Tomcat 默认只回吞 2MB 就掐断连接，浏览器只会看到 Failed to fetch
    max-swallow-size: -1

spring:
  application:
    name: water-kb-rag

  servlet:
    multipart:
      # 数字孪生项目 PPT/报告常含大量截图甚至视频，实测有超 100MB 的 pptx，放宽到 500MB
      max-file-size: 500MB
      max-request-size: 500MB

  # ============ PostgreSQL（含 pgvector 扩展） ============
  # 本地启动：localhost；Docker 容器内：由 compose 传 DB_HOST=postgres（服务名）
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:waterkb}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:rag123}

  # ============ Redis（对话历史存储） ============
  # 本地启动：localhost；Docker 容器内：REDIS_HOST=host.docker.internal（连宿主机 Redis）
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  # ============ Spring AI ============
  ai:
    openai:
      # 大模型 API Key：通过环境变量注入，不要提交到 Git
      # 默认走通义千问 DashScope 兼容模式（chat + embedding 一个 Key 搞定，有免费额度）
      # 到 https://bailian.console.aliyun.com 开通后创建 API-KEY
      api-key: ${AI_API_KEY:}
      # 兼容 OpenAI 协议的 base-url（Spring AI 会自动拼接 /v1/chat/completions、/v1/embeddings）
      base-url: ${AI_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode}
      chat:
        options:
          # 对话模型；换 DeepSeek 时改 base-url=https://api.deepseek.com、model=deepseek-chat
          # 注意：DeepSeek 不提供 embedding 接口，换 DeepSeek 时 embedding 需另配服务
          model: ${AI_CHAT_MODEL:qwen-plus}
          temperature: 0.3
      embedding:
        options:
          # 通义向量模型，输出维度 1024（与下方 pgvector dimensions 保持一致）
          model: ${AI_EMBEDDING_MODEL:text-embedding-v3}
    retry:
      # API 瞬时失败自动重试
      max-attempts: 3
    vectorstore:
      pgvector:
        # 已完全切换到 ES（见 WaterKbApplication 的 exclude），此段仅保留给
        # ModelConfigRepository 读取默认维度种子（dimensions），不再创建向量表
        initialize-schema: false
        dimensions: 1024

# ============ 认证：企业登录 + JWT / OIDC 骨架 ============
security:
  jwt:
    # 密钥必须由环境变量注入；默认值仅用于本地 Demo，生产务必覆盖
    secret: ${JWT_SECRET:water-rag-demo-dev-secret-change-in-prod}
    enabled: ${JWT_ENABLED:true}
  auth:
    # true=未登录访问 API 一律 401（生产，默认）；false=降级到 X-User 演示头（作品集现场演示）
    require-login: ${REQUIRE_LOGIN:true}
    # access 令牌 30 分钟，refresh 令牌 7 天
    access-ttl-seconds: ${ACCESS_TTL:1800}
    refresh-ttl-seconds: ${REFRESH_TTL:604800}
    # 演示签发端点：默认关闭，需要现场复现 OIDC 链路时打开
    issue-endpoint: ${ISSUE_ENDPOINT:false}
    # 初始账号：多个账号用分号分隔，单个格式 用户名|密码|组(逗号分隔)|租户|显示名。
    # 密码可用环境变量整体覆盖（AUTH_USERS），启动时 PBKDF2 哈希，明文不驻留内存对象。
    # 生产务必改密码并改用数据库用户表；默认 admin 仅用于本地/作品集演示。
    users: "${AUTH_USERS:admin|Admin@123456|admin,water-dept|default|系统管理员;analyst|Analyst@123456|water-dept,analyst|default|水利分析员}"

# ============ 用量统计：百炼官方 Usage API（可选，未配置时管理后台显示引导） ============
usage:
  bailian:
    # 工作空间 ID，形如 ws_xxxxxxxxxxxx，从百炼控制台右上角获取
    workspace-id: ${BAILIAN_WORKSPACE_ID:}
    region: ${BAILIAN_REGION:cn-beijing}

# ============ Elasticsearch：混合检索底座 ============
# 容器内用服务名 elasticsearch；本地直连用 localhost
es:
  url: ${ES_URL:http://localhost:9200}
  index: ${ES_INDEX:water_knowledge}
  dimensions: 1024
  knn-candidates: 100
  top-k: 5
  rrf-rank-constant: 60
  min-score: 0

# ============ RAG 自定义参数（RagProperties 绑定） ============
rag:
  # 检索返回 Top-K 片段数：5 → 10 → 20（覆盖更多来源，减少"只答了几个"的观感）。
  # 20 个切片约 1.2 万字，仍在 qwen-plus 上下文范围内；可用环境变量 RAG_TOP_K 覆盖，
  # 再往上会稀释相关性并推高 token 消耗，不建议超过 30。
  top-k: ${RAG_TOP_K:20}
  # 相似度阈值：低于此值的片段直接丢弃（防低相关片段诱导幻觉）
  similarity-threshold: 0.4
  # 切片参数：单切片最大字符数 / 相邻切片重叠字符数
  chunk-max-chars: 600
  chunk-overlap: 100
  # 拼入 Prompt 的历史对话轮数
  history-max-turns: 6
  # Redis 历史最多保留条数与过期时间（hours 为 0 表示永久保存，不设置过期）
  history-max-entries: 40
  history-ttl-hours: 0
  # 流式回答整体超时（秒）
  stream-timeout-seconds: 60
  # 熔断：连续失败 N 次后打开熔断，M 秒内直接降级不再请求大模型
  breaker-failure-threshold: 3
  breaker-open-seconds: 30
  # RAG 系统提示词模板位置（外置配置，改提示词不用重新编译）
  rag-system-prompt: classpath:prompts/rag-system.st
  # 向量化入库单批条数上限（DashScope text-embedding-v3 限制单次 ≤10 条）
  embedding-batch-size: 10

logging:
  level:
    com.joylin.waterkb: DEBUG
    org.springframework.ai: INFO
